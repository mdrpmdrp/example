<style>
  * {
    font-family: 'Pattaya', cursive;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 100%);
    min-height: 100vh;
  }

  /* Welcome Landing Page Styles */
  .welcome-page {
    text-align: center;
    padding: 60px 20px;
  }

  .welcome-logo {
    margin-bottom: 40px;
  }

  .welcome-logo img {
    max-width: 350px;
    height: auto;
    filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.15));
  }

  .welcome-content h1 {
    font-size: 3.5rem;
    font-weight: bold;
    color: #FF6B6B;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
  }

  .welcome-content p {
    font-size: 1.6rem;
    color: #4ECDC4;
    margin-bottom: 15px;
    text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.3);
  }

  .welcome-subtitle {
    font-size: 1.2rem !important;
    opacity: 0.9;
    margin-bottom: 40px !important;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    color: #2C3E50 !important;
  }

  .start-booking-btn {
    font-size: 1.4rem;
    padding: 18px 45px;
    border-radius: 50px;
    background-color: white;
    color: #FF6B6B;
    border: none;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    transition: all 0.3s ease;
    font-weight: 600;
  }

  .start-booking-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    background-color: #f8f9fa;
    color: #FF6B6B;
  }

  .start-booking-btn:focus {
    background-color: #f8f9fa;
    color: #FF6B6B;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
  }

  /* Responsive Welcome */
  @media (max-width: 768px) {
    .welcome-page {
      padding: 40px 15px;
    }

    .welcome-content h1 {
      font-size: 2.5rem;
    }

    .welcome-content p {
      font-size: 1.3rem;
    }

    .welcome-logo img {
      max-width: 250px;
    }

    .start-booking-btn {
      font-size: 1.2rem;
      padding: 15px 35px;
    }
  }

  @media (max-width: 480px) {
    .welcome-page {
      padding: 30px 10px;
    }

    .welcome-content h1 {
      font-size: 2rem;
    }

    .welcome-content p {
      font-size: 1.1rem;
    }

    .welcome-logo img {
      max-width: 200px;
    }

    .start-booking-btn {
      font-size: 1.1rem;
      padding: 12px 30px;
    }
  }

  .main-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
  }

  .booking-card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    padding: 40px;
    max-width: 600px;
    width: 100%;
    margin: 20px;
  }

  .logo-container {
    text-align: center;
    margin-bottom: 30px;
    padding: 40px;
  }

  .logo-container img {
    max-width: 220px;
    height: auto;
    margin-bottom: 20px;
  }

  .logo-container h2 {
    color: #FF6B6B;
    font-weight: 700;
    margin: 0;
    font-family: 'Pattaya', cursive;
    font-size: 2.2rem;
  }

  .step-indicator {
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
  }

  .step {
    display: flex;
    align-items: center;
    margin: 0 10px;
  }

  .step-number {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #e9ecef;
    color: #6c757d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    margin-right: 10px;
  }

  .step.active .step-number {
    background: #FF6B6B;
    color: white;
  }

  .step.completed .step-number {
    background: #4ECDC4;
    color: white;
  }

  .step-line {
    width: 50px;
    height: 2px;
    background: #e9ecef;
    margin: 0 10px;
  }

  .step.completed+.step-line {
    background: #4ECDC4;
  }

  .calendar-container {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 12px;
    margin: 30px 0;
    padding: 25px;
    background: #FFFFFF;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .calendar-header {
    text-align: center;
    font-weight: bold;
    padding: 15px 8px;
    background: #FF6B6B;
    color: white;
    border-radius: 12px;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3);
    position: relative;
    overflow: hidden;
  }

  .calendar-header::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0% {
      left: -100%;
    }

    100% {
      left: 100%;
    }
  }

  .calendar-day {
    aspect-ratio: 1;
    border: 2px solid transparent;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    font-weight: 600;
    font-size: 1.1rem;
    overflow: hidden;
    background: white;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
  }

  .calendar-day::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.1);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .calendar-day:hover::before {
    opacity: 1;
  }

  .calendar-day:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
  }

  .calendar-day.available {
    background: #D4EDDA;
    border-color: #4ECDC4;
    color: #155724;
    box-shadow: 0 8px 25px rgba(78, 205, 196, 0.35);
    font-weight: 700;
  }

  .calendar-day.available:hover {
    background: #4ECDC4;
    color: white;
    box-shadow: 0 15px 40px rgba(78, 205, 196, 0.4);
  }

  .calendar-day.full {
    background: #E6E6E6;
    border-color: #999999;
    color: #666666;
    cursor: not-allowed;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    opacity: 0.5;
    font-weight: 400;
  }

  .calendar-day.full::after {
    content: '✕';
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 0.7rem;
    color: #666666;
    font-weight: bold;
  }

  .calendar-day.closed {
    background: #E6E6E6;
    border-color: #999999;
    color: #666666;
    cursor: not-allowed;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    opacity: 0.5;
    font-weight: 400;
  }

  .calendar-day.closed::after {
    content: '🚫';
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 0.6rem;
    opacity: 0.7;
  }

  .calendar-day.selected {
    background: #FF6B6B;
    border-color: #FF6B6B;
    color: white;
    transform: scale(1.15);
    box-shadow: 0 20px 50px rgba(255, 107, 107, 0.5);
    z-index: 10;
    position: relative;
  }

  .calendar-day.selected::before {
    content: '✓';
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 0.8rem;
    color: white;
    font-weight: bold;
    animation: checkmark 0.5s ease-in-out;
  }

  @keyframes checkmark {
    0% {
      opacity: 0;
      transform: scale(0);
    }

    50% {
      opacity: 1;
      transform: scale(1.2);
    }

    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  .status-legend {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 30px 0;
    font-size: 15px;
    padding: 20px;
    background: #FFFFFF;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 15px;
    border-radius: 25px;
    background: #F8F9FA;
    transition: all 0.3s ease;
    font-weight: 500;
  }

  .legend-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    background: #FFFFFF;
  }

  .legend-color {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  }

  .legend-item:nth-child(1) .legend-color {
    background: #4ECDC4;
  }

  .legend-item:nth-child(2) .legend-color {
    background: #CCCCCC;
  }

  .legend-item:nth-child(3) .legend-color {
    background: #CCCCCC;
  }

  .seat-selection {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin: 20px 0;
  }

  .seat-option {
    border: 2px solid #e9ecef;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .seat-option:hover {
    border-color: #FF6B6B;
    transform: translateY(-2px);
  }

  .seat-option.selected {
    border-color: #FF6B6B;
    background: #FFF5F5;
  }

  .btn-primary {
    background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
    border: none;
    border-radius: 10px;
    padding: 12px 30px;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3);
    background: linear-gradient(45deg, #FF5252, #26D0CE);
  }

  .btn-outline-secondary {
    border-radius: 10px;
    padding: 12px 30px;
    font-weight: 500;
  }

  .form-control {
    border-radius: 10px;
    border: 2px solid #e9ecef;
    padding: 12px 15px;
    transition: all 0.3s ease;
  }

  .form-control:focus {
    border-color: #FF6B6B;
    box-shadow: 0 0 0 0.2rem rgba(255, 107, 107, 0.25);
  }

  .step-content {
    display: none;
  }

  .step-content.active {
    display: block;
  }

  .calendar-navigation {
    background: #FFFFFF;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .calendar-navigation button {
    background: #FF6B6B;
    border: none;
    color: white;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3);
    font-size: 1.2rem;
    cursor: pointer;
    outline: none;
    padding: 0;
    min-width: 45px;
    min-height: 45px;
  }

  .calendar-navigation button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
    background: #4ECDC4;
  }

  .calendar-navigation h4 {
    margin: 0;
    font-weight: 700;
    font-size: 1.5rem;
    color: #FF6B6B;
    text-shadow: none;
    letter-spacing: 1px;
  }

  @media (max-width: 768px) {
    .booking-card {
      padding: 20px;
      margin: 10px;
    }

    .step-text {
      display: none;
    }

    .step-line {
      width: 30px;
    }
  }
</style>
