<script defer>
  let jobs = [];
  let foremen = [];
  let notifications = [];
  let notificationTimer = null;
  let assignmentFromPicker = null;
  let assignmentToPicker = null;
  function formatDisplayDate(value) {
    return value
      ? new Date(value).toLocaleDateString("th-TH", {
        day: "2-digit", month: "short", year: "2-digit",
      })
      : "-";
  }
  function setJobs(assignments) {
    jobs = (assignments || []).map((a) => ({
      id: a.AssignmentId,
      date: formatDisplayDate(a.AssignDate),
      assignmentDate: a.AssignDate,
      supervisor: a.SupervisorName || "-",
      job: a.Job,
      site: a.Site,
      owner: a.Company || "",
      area: a.Area,
      rank: a.Rank,
      foreman: a.ForemanNames || "-",
      foremanUsernames: a.ForemanUsernames || "",
      beforeNote: a.BeforeNote || "",
      afterNote: a.AfterNote || "",
      beforeFileId: a.BeforeFileId || "",
      afterFileId: a.AfterFileId || "",
      beforeUrl: a.BeforeUrl || "",
      afterUrl: a.AfterUrl || "",
      assignmentDate: a.AssignDate,
      supervisorUsername: a.SupervisorUsername || "",
      status: a.Status || "In progress",
    }));
    updateSummary();
  }
  function setForemen(users) {
    foremen = users || [];
    renderForemen();
  }
  function renderForemen() {
    const container = document.getElementById("foremanOptions");
    const template = document.getElementById("foremanOptionTemplate");
    container.replaceChildren();
    if (!foremen.length) {
      const empty = document.createElement("span");
      empty.className = "text-sm text-muted";
      empty.textContent = "ไม่พบรายชื่อ Foreman";
      container.appendChild(empty);
      return;
    }
    foremen.forEach((foreman) => {
      const option = document.importNode(template.content, true);
      const input = option.querySelector("input");
      input.value = foreman.Username;
      input.dataset.name = foreman.Name;
      option.querySelector("label span").textContent = `${foreman.Name} (Foreman)`;
      container.appendChild(option);
    });
  }
  function fillSelect(selector, values, placeholder) {
    const select = document.querySelector(selector);
    if (!select) return;
    const previous = select.value;
    select.replaceChildren();
    if (placeholder) {
      const option = new Option(placeholder, "");
      select.appendChild(option);
    }
    values.forEach((value) => select.appendChild(new Option(value, value)));
    // ให้ผู้ใช้เลือกเองเสมอ ไม่เลือกค่ารายการแรกโดยอัตโนมัติ
    select.value = values.includes(previous) ? previous : "";
  }
  function selectedSupervisor() {
    return (initialData.master?.supervisors || []).find(
      (item) => item.supervisor === $("#assignSupervisor").val(),
    );
  }
  function renderAssignSites() {
    fillSelect("#assignSite", window.initialData.dropdowns?.sites || [], "เลือก...");
  }
  function ownersForSite(site) {
    if (!site) return [];
    return [...new Set((window.initialData.master?.supervisors || [])
      .flatMap((supervisor) => supervisor.sites || [])
      .filter((item) => item.site === site)
      .map((item) => item.owner)
      .filter(Boolean))];
  }
  function renderAssignOwners() {
    const owners = ownersForSite($("#assignSite").val());
    fillSelect("#assignOwner", owners, "เลือก...");
    if (owners.length === 1) $("#assignOwner").val(owners[0]);
  }
  function renderAssignAreas() {
    fillSelect("#assignArea", window.initialData.dropdowns?.areas || [], "เลือก...");
  }
  function renderAssignJobs() {
    // งานเป็นรายการอิสระ ไม่ผูกกับ Rank
    const jobs = [...new Set(window.initialData.dropdowns?.jobs || [])];
    fillSelect("#assignJob", jobs, "เลือก...");
  }
  function renderAssignDropdowns(data, supervisorName) {
    const safeData = data || {};
    const existingData = window.initialData || {};
    const emptyDropdowns = {
      sites: [], owners: [], areas: [], ranks: [], jobs: [], rankJobs: [],
    };
    window.initialData = {
      master: safeData.master && Array.isArray(safeData.master.supervisors)
        ? safeData.master
        : (existingData.master || { supervisors: [] }),
      dropdowns: safeData.dropdowns || existingData.dropdowns || emptyDropdowns,
    };
    $("#assignSupervisor").val(supervisorName || "");
    fillSelect("#assignRank", window.initialData.dropdowns?.ranks || [], "เลือก...");
    renderAssignSites();
    renderAssignOwners();
    renderAssignAreas();
    renderAssignJobs();
  }
  function assignDateValue() {
    const value = $("#assignDate").val();
    const parts = value.split("/");
    return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : value;
  }
  function setAssignDateToToday() {
    const today = new Date();
    const value = [today.getDate(), today.getMonth() + 1, today.getFullYear()]
      .map((part) => String(part).padStart(2, "0"))
      .join("/");
    const picker = document.querySelector("#assignDate")?._flatpickr;
    if (picker) picker.setDate(today, true);
    else $("#assignDate").val(value);
  }
  function clearAssignmentForm() {
    $("#assignSite, #assignOwner, #assignArea, #assignJob, #assignRank").val("");
    $("#foremanOptions input[name=\"foreman\"]").prop("checked", false);
    setAssignDateToToday();
  }
  function updateSummary() {
    const progress = jobs.filter((j) => j.status === "In progress").length;
    const success = jobs.filter((j) => j.status === "Success").length;
    const total = jobs.length;
    const progressRate = total ? Math.round((progress / total) * 100) : 0;
    const successRate = total ? Math.round((success / total) * 100) : 0;
    $("#totalJobs").text(jobs.length);
    $("#progressJobs").text(progress);
    $("#successJobs").text(success);
    $("#waitingJobs,#pendingCount").text(progress);
    $("#totalJobsNote").text("ข้อมูลปัจจุบัน");
    $("#progressRate").text(progressRate + "%");
    $("#successRate").text(successRate + "%");
    $("#waitingJobsNote").text(progress + " งานที่ยังไม่เสร็จ");
    $("#assignmentCount").text(jobs.length + " รายการ");
    $("#reportSummary").text(
      jobs.length
        ? `ข้อมูล ${jobs.length} งาน · ${progress} งานกำลังดำเนินการ · ${success} งานเสร็จสิ้น`
        : "ยังไม่มีข้อมูลงาน",
    );
  }
  function statusTag(s) {
    if (s === "Updating" || s === "Cancelling") {
      const label = s === "Cancelling" ? "กำลังยกเลิก..." : "กำลังบันทึก...";
      return `<span class="status status-loading"><i data-lucide="loader-circle" class="w-3 animate-spin"></i>${label}</span>`;
    }
    const className = s === "Success" ? "status-success" : s === "Cancelled" ? "status-cancelled" : "status-progress";
    return `<span class="status ${className}">${s}</span>`;
  }
  function dateKey(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
  }
  function filterJobsByDate(period, singleDate, fromDate, toDate) {
    let from = "", to = "";
    const today = new Date();
    if (period === "today") {
      from = to = dateKey(today);
    } else if (period === "week") {
      const start = new Date(today);
      const day = start.getDay() || 7;
      start.setDate(start.getDate() - day + 1);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      from = dateKey(start);
      to = dateKey(end);
    } else if (period === "month") {
      from = dateKey(new Date(today.getFullYear(), today.getMonth(), 1));
      to = dateKey(new Date(today.getFullYear(), today.getMonth() + 1, 0));
    } else if (period === "single") {
      from = to = singleDate;
    } else if (period === "range") {
      from = fromDate;
      to = toDate;
    }
    return jobs.filter((job) => {
      const jobDate = dateKey(job.assignmentDate);
      const matchesDate = !from && !to ? true : Boolean(jobDate && from && (!to || jobDate <= to) && jobDate >= from);
      return matchesDate;
    });
  }
  function getFilteredJobs() {
    const status = $("#assignmentStatusFilter").val() || "ทั้งหมด";
    const filteredByDate = filterJobsByDate(
      $("#assignmentDateFilter").val() || "all",
      $("#assignmentSingleDate").val(), $("#assignmentFromDate").val(), $("#assignmentToDate").val(),
    );
    return filteredByDate.filter((job) => status === "ทั้งหมด" || job.status === status);
  }
  function updateAssignmentFilters() {
    const period = $("#assignmentDateFilter").val();
    $("#assignmentSingleDateWrap").toggleClass("hidden", period !== "single");
    $("#assignmentDateRange").toggleClass("hidden", period !== "range").toggleClass("flex", period === "range");
    renderRows();
  }
  function updateSubmitFilters() {
    const period = $("#submitDateFilter").val() || "all";
    $("#submitSingleDateWrap").toggleClass("hidden", period !== "single");
    $("#submitDateRange").toggleClass("hidden", period !== "range").toggleClass("flex", period === "range");
    renderSubmit();
  }
  function refreshIcons() {
    if (window.lucide && typeof window.lucide.createIcons === "function") {
      window.lucide.createIcons();
    }
  }
  function renderRows() {
    const filteredJobs = getFilteredJobs();
    const assignmentHtml = filteredJobs
      .map(
        (j) =>
          `<tr><td>${statusTag(j.status)}</td><td><button type="button" class="font-semibold text-brand hover:underline" data-submit-job="${j.id}">${j.id}</button></td><td>${j.supervisor || "-"}</td><td>${j.site || "-"}</td><td>${j.area || "-"}</td><td><div class="font-semibold">${j.job || "-"}</div></td><td><span class="font-semibold">${j.rank || "-"}</span></td><td>${j.date}</td><td>${j.foreman || "-"}</td></tr>`,
      )
      .join("");
    const recentHtml = jobs
      .slice(0, 5)
      .map(
        (j) =>
          `<tr><td>${statusTag(j.status)}</td><td><button type="button" class="font-semibold text-brand hover:underline" data-submit-job="${j.id}">${j.id}</button></td><td>${j.supervisor || "-"}</td><td>${j.site || "-"}</td><td>${j.area || "-"}</td><td><div class="font-semibold">${j.job || "-"}</div></td><td><span class="font-semibold">${j.rank || "-"}</span></td><td>${j.date}</td><td>${j.foreman || "-"}</td></tr>`,
      )
      .join("");
    $("#assignmentRows").html(assignmentHtml || '<tr><td colspan="9" class="text-center text-muted py-8">ไม่พบงานตามเงื่อนไขที่เลือก</td></tr>');
    $("#assignmentCount").text(filteredJobs.length + " จาก " + jobs.length + " รายการ");
    $("#recentRows").html(recentHtml);
    refreshIcons();
  }
  const selectedFiles = {};
  const previewUrls = {};
  let uploadToken = null;
  const uploadFolderPromises = {};
  let uploadLibrariesPromise = null;
  function loadExternalScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = src;
      script.onload = resolve;
      script.onerror = () => reject(new Error("โหลดไลบรารีอัปโหลดไม่สำเร็จ"));
      document.head.appendChild(script);
    });
  }

  function getUploadAuth(jobId) {
    if (!jobId) return Promise.reject(new Error("ไม่พบรหัสงานสำหรับเตรียมโฟลเดอร์อัปโหลด"));
    if (uploadFolderPromises[jobId]) return uploadFolderPromises[jobId];
    if (!window.google || !google.script)
      return Promise.reject(
        new Error("กรุณาเปิดผ่าน Google Apps Script Web App"),
      );
    uploadFolderPromises[jobId] = new Promise((resolve, reject) =>
      google.script.run
        .withSuccessHandler((r) => {
          uploadToken = uploadToken || r.accessToken;
          resolve({ accessToken: uploadToken, folderId: r.folderId });
        })
        .withFailureHandler(reject)
        .getUploadAuth(jobId),
    );
    return uploadFolderPromises[jobId];
  }

  function compressSelected(file) {
    const isHeic =
      /\.(heic|heif)$/i.test(file.name) || /image\/heic/i.test(file.type);
    const converted = isHeic
      ? heic2any({ blob: file, toType: "image/jpeg", quality: 0.7 }).then(
        (blob) =>
          new File([blob], file.name.replace(/\.(heic|heif)$/i, ".jpg"), {
            type: "image/jpeg",
          }),
      )
      : Promise.resolve(file);
    return converted.then(
      (input) =>
        new Promise(
          (resolve, reject) =>
            new Compressor(input, {
              quality: 0.65,
              maxWidth: 1600,
              maxHeight: 1600,
              convertSize: 500000,
              success: (output) => {
                console.log(`[FieldFlow] ${file.name} | ก่อนบีบอัด: ${file.size} bytes | หลังบีบอัด: ${output.size} bytes`);
                resolve(output);
              },
              error: reject,
            }),
        ),
    );
  }

  function uploadToDrive(file, token, folderId, onProgress) {
    return new Promise((resolve, reject) => {
      const ru = new ResumableUploadToGoogleDrive2();
      ru.Do({ file, accessToken: token, folderId, fields: "id" }, (res, err) => {
        if (err) {
          console.error("[FieldFlow upload] error", file.name, err);
          reject(err);
          return;
        }
        console.log("[FieldFlow upload] callback", file.name, {
          status: res?.status,
          progressByte: res?.progressByte,
          progressNumber: res?.progressNumber,
        });
        if (res.status === "Uploading") {
          const current = Number(res.progressByte?.current ?? res.progressNumber?.current ?? 0);
          const total = Number(res.progressByte?.total ?? res.progressNumber?.end ?? 0);
          const p = total > 0 ? Math.round((current / total) * 100) : 0;
          console.log("[FieldFlow upload] progress", file.name, current + "/" + total, p + "%");
          onProgress(Math.min(99, p));
        }
        if (res.status === "Done") {
          console.log("[FieldFlow upload] done", file.name, res.result);
          resolve(res.result);
        }
      });
    });
  }

  function renderSubmit() {
    const filteredJobs = filterJobsByDate(
      $("#submitDateFilter").val() || "all",
      $("#submitSingleDate").val(), $("#submitFromDate").val(), $("#submitToDate").val(),
    );
    const imageCell = (fileId, url, label) => {
      if (!fileId && !url) return '<span class="text-muted">-</span>';
      const previewUrl = fileId ? "https://lh3.googleusercontent.com/d/" + fileId + "=w200" : url;
      const fullUrl = fileId ? "https://lh3.googleusercontent.com/d/" + fileId : url;
      return `<button type="button" class="image-thumb" data-preview-image="${fullUrl}" data-preview-title="${label}"><img src="${previewUrl}" alt="${label}" loading="lazy" /></button>`;
    };
    const html = filteredJobs.map((j) => `<tr data-job-id="${j.id}">
      <td>${statusTag(j.status)}</td><td><button type="button" class="font-semibold text-brand hover:underline" data-submit-job="${j.id}">${j.id}</button></td>
      <td>${j.supervisor || "-"}</td><td>${j.site || "-"}</td><td>${j.area || "-"}</td><td><div class="font-semibold">${j.job || "-"}</div></td><td>${j.rank || "-"}</td><td>${j.date}</td><td>${j.foreman || "-"}</td>
      <td>${imageCell(j.beforeFileId, j.beforeUrl, "ภาพก่อน")}</td><td>${imageCell(j.afterFileId, j.afterUrl, "ภาพหลัง")}</td>
      <td>${j.status === "In progress" ? '<button type="button" class="btn-primary rounded-lg h-9 px-3 text-xs font-semibold open-submit-modal">ส่งงาน</button>' : '<span class="text-xs text-muted">-</span>'}</td>
    </tr>`).join("");
    $("#submitList").html(html || '<tr><td colspan="12" class="text-center text-muted py-8">ไม่พบงานตามเงื่อนไขที่เลือก</td></tr>');
    refreshIcons();
  }

  function toast(msg) {
    $("#toast").text(msg).addClass("show");
    setTimeout(() => $("#toast").removeClass("show"), 2500);
  }
  function renderNotifications(payload) {
    let data = payload;
    if (typeof data === "string") {
      try {
        data = JSON.parse(data);
      } catch (error) {
        data = null;
      }
    }
    data = data || {items: [], unreadCount: 0};
    notifications = data.items || [];
    const unreadCount = Number(data.unreadCount) || 0;
    $("#notificationBadge").text(unreadCount > 99 ? "99+" : unreadCount).toggleClass("hidden", unreadCount === 0);
    const list = $("#notificationList").empty();
    if (!notifications.length) {
      list.append($('<div class="p-6 text-center text-sm text-muted">ยังไม่มีการแจ้งเตือน</div>'));
      return;
    }
    notifications.forEach((notification) => {
      const item = $("<button type='button'>", {class: "notification-item"})
        .toggleClass("unread", !notification.IsRead)
        .attr("data-notification-id", notification.NotificationId)
        .attr("data-assignment-id", notification.AssignmentId);
      $("<div>", {class: "flex items-start gap-2"}).append(
        $("<span>", {class: "mt-1 w-2 h-2 rounded-full bg-brand flex-none"}).toggleClass("invisible", notification.IsRead),
        $("<span>", {class: "font-semibold text-sm"}).text(notification.Title),
      ).appendTo(item);
      $("<div>", {class: "text-xs text-muted mt-1 pl-4"}).text(notification.Message).appendTo(item);
      item.appendTo(list);
    });
  }
  function refreshNotifications() {
    const token = getStoredSessionToken();
    if (!token || !window.google || !google.script || !google.script.run) return;
    google.script.run.withSuccessHandler(renderNotifications).getNotifications(token);
  }
  function startNotificationPolling() {
    if (notificationTimer) clearInterval(notificationTimer);
    notificationTimer = setInterval(refreshNotifications, 45000);
  }
  function stopNotificationPolling() {
    if (notificationTimer) clearInterval(notificationTimer);
    notificationTimer = null;
  }

  function showTab(tab) {
    $(".tab-panel").removeClass("active");
    $("#" + tab).addClass("active");
    $(".nav-item").removeClass("active");
    $(`.nav-item[data-tab="${tab}"]`).addClass("active");
    window.scrollTo(0, 0);
  }
  function uploadImagesTogether(images, token, folderId, onProgress) {
    const progress = Object.fromEntries(Object.keys(images).map((kind) => [kind, 0]));
    return Promise.all(Object.entries(images).map(([kind, file]) =>
      uploadToDrive(file, token, folderId, (value) => {
        progress[kind] = value;
        onProgress({ ...progress });
      }),
    ));
  }
  function confirmAction(title, text, confirmButtonText, icon = "question") {
    return Swal.fire({
      title,
      text,
      icon,
      showCancelButton: true,
      confirmButtonText,
      cancelButtonText: "กลับไปตรวจสอบ",
      reverseButtons: true,
      focusCancel: true,
      confirmButtonColor: "#07883f",
      cancelButtonColor: "#68746b",
    }).then((result) => result.isConfirmed);
  }

  function toInputDate(value) {
    if (!value) return "";
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "" : date.toISOString().slice(0, 10);
  }
  function editOptionValues(selector, values, selected) {
    const select = document.querySelector(selector);
    if (!select) return;
    select.replaceChildren(new Option("เลือก...", ""));
    [...new Set(values.filter(Boolean))].forEach((value) => select.appendChild(new Option(value, value)));
    select.value = values.includes(selected) ? selected : "";
  }
  function renderEditAreas() {
    const selected = $("#editArea").data("selected") || "";
    editOptionValues("#editArea", window.initialData.dropdowns?.areas || [], selected);
    $("#editArea").removeData("selected");
  }
  function renderEditOwners(selected) {
    const owners = ownersForSite($("#editSite").val());
    editOptionValues("#editOwner", owners, owners.length === 1 ? owners[0] : selected);
  }
  function openAssignmentEditor(jobId) {
    const job = jobs.find((item) => String(item.id) === String(jobId));
    if (!job || !window.FIELD_FLOW_USER) return;
    const canEdit = window.FIELD_FLOW_USER.Role === "Supervisor";
    if (job.status === "Updating" || job.status === "Cancelling") {
      toast("กำลังดำเนินการกับงานนี้ กรุณารอสักครู่");
      return;
    }
    const isCancelled = job.status === "Cancelled";
    const isSuccess = job.status === "Success";
    const isReadOnly = isCancelled || isSuccess || !canEdit;
    $("#editAssignmentTitle").text(job.id);
    editOptionValues("#editSite", window.initialData.dropdowns?.sites || [], job.site);
    renderEditOwners(job.owner || "");
    $("#editArea").data("selected", job.area);
    renderEditAreas();
    editOptionValues("#editJob", window.initialData.dropdowns?.jobs || [], job.job);
    editOptionValues("#editRank", window.initialData.dropdowns?.ranks || [], job.rank);
    $("#editAssignDate").val(toInputDate(job.assignmentDate));
    const container = $("#editForemanOptions").empty();
    const selectedUsernames = String(job.foremanUsernames || "").split(",").map((name) => name.trim()).filter(Boolean);
    foremen.forEach((foreman) => {
      const label = $("<label>", { class: "flex items-center gap-2 rounded-lg border border-line px-3 py-2 text-sm cursor-pointer hover:border-brand" });
      const input = $("<input>", { type: "checkbox", class: "accent-brand w-4 h-4", value: foreman.Username }).attr("data-name", foreman.Name).prop("checked", selectedUsernames.includes(foreman.Username));
      label.append(input, $("<span>").text(`${foreman.Name} (Foreman)`));
      container.append(label);
    });
    if (!foremen.length) container.append($("<span>", { class: "text-sm text-muted" }).text("ไม่พบรายชื่อ Foreman"));
    $("#assignmentEditForm input, #assignmentEditForm select").prop("disabled", isReadOnly);
    $("#saveEditAssignment").prop("disabled", isReadOnly).toggleClass("hidden", isReadOnly);
    $("#cancelAssignment")
      .prop("disabled", isReadOnly)
      .text(isCancelled ? "งานนี้ถูกยกเลิกแล้ว" : isSuccess ? "งานนี้เสร็จสิ้นแล้ว" : canEdit ? "ยกเลิกงาน" : "ดูรายละเอียดเท่านั้น")
      .toggleClass("hidden", isReadOnly);
    $("#assignmentEditDialog").data("job-id", job.id)[0].showModal();
    refreshIcons();
  }
  function openJobModal(jobId) {
    if (window.FIELD_FLOW_USER?.Role === "Foreman") openSubmitModal(jobId);
    else openAssignmentEditor(jobId);
  }
  function closeAssignmentEditor() {
    const dialog = document.getElementById("assignmentEditDialog");
    if (dialog?.open) dialog.close();
  }
  function openSubmitModal(jobId) {
    const job = jobs.find((item) => String(item.id) === String(jobId));
    if (!job) return;
    const submitDialog = document.getElementById("submitUploadDialog");
    if (submitDialog.parentElement !== document.body) document.body.appendChild(submitDialog);
    if (submitDialog.open) submitDialog.close();
    const modal = $("#submitUploadDialog").attr("data-job-id", job.id).data("job-id", job.id);
    $("#submitModalTitle").text(job.id + " · " + (job.job || "งานภาคสนาม"));
    $("#submitModalMeta").text(`${job.site || "-"} · ${job.area || "-"} · ${job.date}`);
    $("#submitBeforeNote").val(job.beforeNote || "");
    $("#submitAfterNote").val(job.afterNote || "");
    $("#submitBeforeFile, #submitAfterFile").val("");
    $("#submitBeforePreview, #submitAfterPreview").addClass("hidden");
    $("#submitBeforePreviewPlaceholder, #submitAfterPreviewPlaceholder").removeClass("hidden");
    ["before", "after"].forEach((kind) => {
      const file = selectedFiles[job.id]?.[kind];

  let sessionIdleTimer = null;
  let lastSessionTouch = 0;
  let sessionActivityHandler = null;
  const SESSION_IDLE_MS = 60 * 60 * 1000;
  const SESSION_TOUCH_INTERVAL_MS = 5 * 60 * 1000;
  function stopSessionActivity() {
    if (sessionIdleTimer) clearTimeout(sessionIdleTimer);
    sessionIdleTimer = null;
    if (sessionActivityHandler) {
      ["click", "keydown", "scroll", "touchstart"].forEach((eventName) =>
        document.removeEventListener(eventName, sessionActivityHandler),
      );
      sessionActivityHandler = null;
    }
  }
  function expireSession() {
    const token = getStoredSessionToken();
    if (token && window.google && google.script) google.script.run.logoutSession(token);

  function startSessionActivity() {
    stopSessionActivity();
    const markActivity = () => {
      const token = getStoredSessionToken();
      if (!token || !window.FIELD_FLOW_USER) return;
      if (sessionIdleTimer) clearTimeout(sessionIdleTimer);
      sessionIdleTimer = setTimeout(expireSession, SESSION_IDLE_MS);
      const now = Date.now();
      if (now - lastSessionTouch < SESSION_TOUCH_INTERVAL_MS) return;
      lastSessionTouch = now;
      google.script.run
        .withFailureHandler(expireSession)
        .touchSession(token);
    };
    sessionActivityHandler = markActivity;
    ["click", "keydown", "scroll", "touchstart"].forEach((eventName) =>
      document.addEventListener(eventName, markActivity, { passive: true }),
    );
    markActivity();
  }

    $(".user-copy div:last-child").text(user.Role);
    $('.nav-item[data-tab="assign"]').toggle(user.Role === "Supervisor");
    $('[data-tab="assign"]').toggle(user.Role === "Supervisor");
    $("#assign .surface").first().toggle(user.Role === "Supervisor");
    $('.nav-item[data-tab="submit"]').toggle(user.Role === "Foreman");
    $('.mobile-nav [data-tab="submit"]').toggle(user.Role === "Foreman");
    setJobs([]);
    setForemen([]);
    renderRows();
    renderSubmit();
    updateSplash("กำลังโหลดข้อมูล workspace...", 45);
    new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .getBootstrap(getStoredSessionToken());
    })
      .then(function (data) {
        updateSplash("กำลังจัดเตรียมเมนูและรายการงาน...", 80);
        const bootstrap = JSON.parse(data || "{}");
        console.log("Bootstrap data:", bootstrap);
        window.initialData = { master: bootstrap.master, dropdowns: bootstrap.dropdowns };
        renderAssignDropdowns({ master: bootstrap.master, dropdowns: bootstrap.dropdowns }, user.Name);
        setJobs(bootstrap.assignments);
        setForemen(bootstrap.foremen);
        renderNotifications(bootstrap.notifications);
        startNotificationPolling();
        renderRows();
        renderSubmit();
        updateSplash("พร้อมใช้งาน กำลังเปิด workspace...", 100);
        window.setTimeout(() => {
          hideSplash();
          $("#appView").removeClass("hidden");
        }, 180);
      })
      .catch(function (error) {
        console.error("Bootstrap failed:", error);
        clearStoredSessionToken();
        window.FIELD_FLOW_USER = null;
        stopSessionActivity();
        showSplashError("โหลดข้อมูลเริ่มต้นไม่สำเร็จ กรุณาเข้าสู่ระบบอีกครั้ง");
        window.setTimeout(() => {
          hideSplash();
          $("#appView").addClass("hidden");
          $("#loginView").show();
          toast(error.message || "โหลดข้อมูลเริ่มต้นไม่สำเร็จ");
        }, 900);
      });
  }
  function bootApp() {

    initApp();

    const login = document.getElementById("loginBtn");
    if (login)
      login.addEventListener("click", function () {
        const username = document.getElementById("loginUsername").value.trim(),
          password = document.getElementById("loginPassword").value;
        if (!username || !password) {
          toast("กรุณากรอก Username และ Password");
          return;
        }
        if (!window.google || !google.script || !google.script.run) {
          toast("กรุณาเปิดหน้านี้ผ่าน Google Apps Script Web App");
          return;
        }
        login.disabled = true;
        login.innerHTML = "กำลังตรวจสอบ...";
        google.script.run
          .withSuccessHandler(function (user) {
            storeSessionToken(user.sessionToken, $("#rememberMe").prop("checked"));
            showSplash("เข้าสู่ระบบสำเร็จ กำลังโหลดข้อมูลเริ่มต้น...", 20);
            loadUserSession(user);
            login.disabled = false;
            login.innerHTML =
              'เข้าสู่ระบบ <i data-lucide="arrow-right" class="inline w-4 ml-1 align-[-3px]"></i>';
            refreshIcons();
          })
          .withFailureHandler(function (error) {
            toast(error.message || "เข้าสู่ระบบไม่สำเร็จ");
            login.disabled = false;
            login.innerHTML =
              'เข้าสู่ระบบ <i data-lucide="arrow-right" class="inline w-4 ml-1 align-[-3px]"></i>';
            refreshIcons();
          })
          .authenticateUser(username, password);
      });
    document.addEventListener(
      "click",
      async function (e) {
        const assign = e.target.closest("#saveAssignment");
        if (assign) {
          e.stopImmediatePropagation();
          if (
            !window.FIELD_FLOW_USER ||
            window.FIELD_FLOW_USER.Role !== "Supervisor"
          ) {
            toast("เฉพาะ Supervisor เท่านั้นที่มอบหมายงานได้");
            return;
          }
          const selectedForemen = Array.from(
            document.querySelectorAll('#foremanOptions input[name="foreman"]:checked'),
          );
          if (!selectedForemen.length) {
            toast("กรุณาเลือกผู้รับผิดชอบอย่างน้อย 1 คน");
            return;
          }
          if (!await confirmAction("ยืนยันการสร้างงาน?", "ระบบจะบันทึกงานใหม่ลงในชีต Assignments", "บันทึกงาน")) return;
          setAssignmentLoading(true);
          const payload = {
            username: window.FIELD_FLOW_USER.Username,
            site: $("#assignSite").val(),
            owner: $("#assignOwner").val(),
            area: $("#assignArea").val(),
            job: $("#assignJob").val(),
            rank: $("#assignRank").val(),
            assignDate: assignDateValue(),
            supervisorName: window.FIELD_FLOW_USER.Name,
            foremanUsernames: selectedForemen.map((input) => input.value),
            foremanNames: selectedForemen.map((input) => input.dataset.name),
          };
          google.script.run
            .withSuccessHandler((r) => {
              toast("สร้างงาน " + r.assignmentId + " และบันทึกลงชีตแล้ว");
              jobs.unshift({
                id: r.assignmentId,
                supervisor: $("#assignSupervisor").val(),
                site: $("#assignSite").val(),
                owner: $("#assignOwner").val(),
                area: $("#assignArea").val(),
                job: $("#assignJob").val(),
                rank: $("#assignRank").val(),
                date: formatDisplayDate(assignDateValue()),
                assignmentDate: assignDateValue(),
                foreman: selectedForemen.map((input) => input.dataset.name).join(", "),
                status: "In progress",
              });
              updateSummary();
              renderRows();
              clearAssignmentForm();
              setAssignmentLoading(false);
            })
            .withFailureHandler((err) => {
              setAssignmentLoading(false);
              toast(err.message || "บันทึกงานไม่สำเร็จ");
            })
            .saveAssignment(payload);
          return;
        }
        const submit = e.target.closest("#submitModalUpload");
        if (submit) {
          e.stopImmediatePropagation();
          const card = $(submit).closest("[data-job-id]"),
            jobId = card.data("job-id"),
            files = selectedFiles[jobId] || {},
            combinedFiles = Array.from(document.getElementById("submitFiles")?.files || []);
          if (
            !window.FIELD_FLOW_USER ||
            window.FIELD_FLOW_USER.Role !== "Foreman"
          ) {
            toast("เฉพาะ Foreman เท่านั้นที่ส่งงานได้");
            return;
          }
          if (!files.before || !files.after || combinedFiles.length < 2) {
            toast("กรุณาเลือกภาพก่อนและภาพหลังให้ครบ");
            return;
          }
          submit.disabled = true;
          submit.textContent = "กำลังอัปโหลด...";
          const status = card.find(".upload-status").removeClass("hidden"),
            bar = card.find(".upload-bar"),
            pct = card.find(".upload-percent"),
            label = card.find(".upload-label");
          (async () => {
            try {
              label.text("กำลังเตรียมไฟล์...");
              const [before, after] = await Promise.all([
                compressSelected(files.before),
                compressSelected(files.after),
              ]),
                uploadAuth = await getUploadAuth(jobId),
                auth = uploadAuth.accessToken,
                folderId = uploadAuth.folderId;
              bar.css("width", "10%");
              pct.text("10%");
              label.text("กำลังอัปโหลดภาพ...");
              const [beforeResult, afterResult] = await uploadImagesTogether(
                { before, after },
                auth,
                folderId,
                (progress) => {
                  const total = 10 + (progress.before * 0.4) + (progress.after * 0.4);
                  bar.css("width", total + "%");
                  pct.text(Math.round(total) + "%");
                },
              );
              bar.css("width", "90%");
              pct.text("90%");
              label.text("กำลังบันทึกข้อมูลลงชีต...");
              await new Promise((resolve, reject) =>
                google.script.run
                  .withSuccessHandler(resolve)
                  .withFailureHandler(reject)
                  .saveSubmission({
                    username: window.FIELD_FLOW_USER.Username,
                    assignmentId: jobId,
                    beforeFileId: beforeResult.id,
                    afterFileId: afterResult.id,
                    beforeUrl:
                      "https://drive.google.com/open?id=" + beforeResult.id,
                    afterUrl:
                      "https://drive.google.com/open?id=" + afterResult.id,
                    beforeNote: $("#submitBeforeNote").val().trim(),
                    afterNote: $("#submitAfterNote").val().trim(),
                  }),
              );
              bar.css("width", "100%");
              pct.text("100%");
              label.text("ส่งงานสำเร็จ");
              toast("อัปโหลดและบันทึกงาน " + jobId + " เรียบร้อยแล้ว");
              setTimeout(() => card.fadeOut(200), 700);
            } catch (err) {
              label.text("อัปโหลดไม่สำเร็จ");
              toast(err.message || "อัปโหลดไม่สำเร็จ");
              submit.disabled = false;
              submit.textContent = "ส่งงาน";
            }
          })();
        }
      },
      true,
    );
    const sessionToken = getStoredSessionToken();
    if (sessionToken && window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (user) {
          if (user) loadUserSession(user);
          else {
            clearStoredSessionToken();
            finishSessionCheck(true);
          }
        })
        .withFailureHandler(function () {
          clearStoredSessionToken();
          finishSessionCheck(true);
        })
        .getSession(sessionToken);
    }
  }
  $(document).ready(bootApp);

</script>
