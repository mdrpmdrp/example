<script defer>
  let exportImageCache = new Map();
  let jobs = [];
  let foremen = [];
  let notifications = [];
  let notificationTimer = null;
  let notificationUnreadCount = null;
  let toastTimer = null;
  let assignmentFromPicker = null;
  let assignmentToPicker = null;
  function formatDisplayDate(value) {
    return value
      ? new Date(value).toLocaleDateString("th-TH", {
          day: "2-digit",
          month: "short",
          year: "2-digit",
        })
      : "-";
  }
  function setJobs(assignments) {
    jobs = (assignments || []).map((a) => ({
      id: a.AssignmentId,
      date: formatDisplayDate(a.AssignDate),
      assignmentDate: a.AssignDate,
      supervisor: a.SupervisorName || "-",
      job: a.Job,
      site: a.Site,
      owner: a.Company || "",
      area: a.Area,
      rank: a.Rank,
      foreman: a.ForemanNames || "-",
      foremanUsernames: a.ForemanUsernames || "",
      beforeNote: a.BeforeNote || "",
      afterNote: a.AfterNote || "",
      beforeFileId: a.BeforeFileId || "",
      afterFileId: a.AfterFileId || "",
      beforeUrl: a.BeforeUrl || "",
      afterUrl: a.AfterUrl || "",
      assignmentDate: a.AssignDate,
      supervisorUsername: a.SupervisorUsername || "",
      status: a.Status || "In progress",
    }));
    updateSummary();
  }
  function setForemen(users) {
    foremen = users || [];
    renderForemen();
  }
  function renderForemen() {
    const container = document.getElementById("foremanOptions");
    const template = document.getElementById("foremanOptionTemplate");
    container.replaceChildren();
    if (!foremen.length) {
      const empty = document.createElement("span");
      empty.className = "text-sm text-muted";
      empty.textContent = "ไม่พบรายชื่อ Foreman";
      container.appendChild(empty);
      return;
    }
    foremen.forEach((foreman) => {
      const option = document.importNode(template.content, true);
      const input = option.querySelector("input");
      input.value = foreman.Username;
      input.dataset.name = foreman.Name;
      option.querySelector("label span").textContent =
        foreman.Name + " (Foreman)";
      container.appendChild(option);
    });
  }
  function fillSelect(selector, values, placeholder) {
    const select = document.querySelector(selector);
    if (!select) return;
    const previous = select.value;
    select.replaceChildren();
    if (placeholder) {
      const option = new Option(placeholder, "");
      select.appendChild(option);
    }
    values.forEach((value) => select.appendChild(new Option(value, value)));
    // ให้ผู้ใช้เลือกเองเสมอ ไม่เลือกค่ารายการแรกโดยอัตโนมัติ
    select.value = values.includes(previous) ? previous : "";
  }
  function renderAssignSites() {
    fillSelect(
      "#assignSite",
      window.initialData.dropdowns?.sites || [],
      "เลือก...",
    );
  }
  function ownersForSite(site) {
    if (!site) return [];
    return [
      ...new Set(
        (window.initialData.master?.supervisors || [])
          .flatMap((supervisor) => supervisor.sites || [])
          .filter((item) => item.site === site)
          .map((item) => item.owner)
          .filter(Boolean),
      ),
    ];
  }
  function renderAssignOwners() {
    const owners = ownersForSite($("#assignSite").val());
    fillSelect("#assignOwner", owners, "เลือก...");
    if (owners.length === 1) $("#assignOwner").val(owners[0]);
  }
  function areasForSite(site) {
    if (!site) return [];
    return [
      ...new Set(
        (window.initialData.master?.supervisors || [])
          .flatMap((supervisor) => supervisor.sites || [])
          .filter((item) => item.site === site)
          .flatMap((item) => item.areas || [])
          .filter(Boolean),
      ),
    ];
  }
  function renderAssignAreas() {
    const site = $("#assignSite").val();
    fillSelect("#assignArea", areasForSite(site), site ? "เลือก..." : "เลือก Site ก่อน");
  }
  function renderAssignJobs() {
    // งานเป็นรายการอิสระ ไม่ผูกกับ Rank
    const jobs = [...new Set(window.initialData.dropdowns?.jobs || [])];
    fillSelect("#assignJob", jobs, "เลือก...");
  }
  function renderAssignDropdowns(data, supervisorName) {
    const safeData = data || {};
    const existingData = window.initialData || {};
    const emptyDropdowns = {
      sites: [],
      owners: [],
      areas: [],
      ranks: [],
      jobs: [],
      rankJobs: [],
    };
    window.initialData = {
      master:
        safeData.master && Array.isArray(safeData.master.supervisors)
          ? safeData.master
          : existingData.master || { supervisors: [] },
      dropdowns: safeData.dropdowns || existingData.dropdowns || emptyDropdowns,
    };
    $("#assignSupervisor").val(supervisorName || "");
    fillSelect(
      "#assignRank",
      window.initialData.dropdowns?.ranks || [],
      "เลือก...",
    );
    renderAssignSites();
    renderAssignOwners();
    renderAssignAreas();
    renderAssignJobs();
  }
  function assignDateValue() {
    const value = $("#assignDate").val();
    const parts = value.split("/");
    return parts.length === 3
      ? parts[2] + "-" + parts[1] + "-" + parts[0]
      : value;
  }
  function setAssignDateToToday() {
    const today = new Date();
    const value = [today.getDate(), today.getMonth() + 1, today.getFullYear()]
      .map((part) => String(part).padStart(2, "0"))
      .join("/");
    const picker = document.querySelector("#assignDate")?._flatpickr;
    if (picker) picker.setDate(today, true);
    else $("#assignDate").val(value);
  }
  function clearAssignmentForm() {
    $("#assignSite, #assignOwner, #assignArea, #assignJob, #assignRank").val(
      "",
    );
    renderAssignAreas();
    $('#foremanOptions input[name="foreman"]').prop("checked", false);
    setAssignDateToToday();
  }
  function updateSummary() {
    const progress = jobs.filter((j) => j.status === "In progress").length;
    const success = jobs.filter((j) => j.status === "Success").length;
    const total = jobs.length;
    const progressRate = total ? Math.round((progress / total) * 100) : 0;
    const successRate = total ? Math.round((success / total) * 100) : 0;
    $("#totalJobs").text(jobs.length);
    $("#progressJobs").text(progress);
    $("#successJobs").text(success);
    $("#waitingJobs").text(progress);
    $("#pendingCount")
      .text("รอส่ง " + progress)
      .toggleClass("hidden", progress === 0);
    $("#totalJobsNote").text("ข้อมูลปัจจุบัน");
    $("#progressRate").text(progressRate + "%");
    $("#successRate").text(successRate + "%");
    $("#waitingJobsNote").text(progress + " งานที่ยังไม่เสร็จ");
    $("#assignmentCount").text(jobs.length + " รายการ");
    $("#reportSummary").text(
      jobs.length
        ? "ข้อมูล " +
            jobs.length +
            " งาน · " +
            progress +
            " งานกำลังดำเนินการ · " +
            success +
            " งานเสร็จสิ้น"
        : "ยังไม่มีข้อมูลงาน",
    );
  }
  function statusTag(s) {
    if (s === "Updating" || s === "Cancelling") {
      const label = s === "Cancelling" ? "กำลังยกเลิก..." : "กำลังบันทึก...";
      return (
        '<span class="status status-loading"><i data-lucide="loader-circle" class="w-3 animate-spin"></i>' +
        label +
        "</span>"
      );
    }
    const className =
      s === "Success"
        ? "status-success"
        : s === "Cancelled"
          ? "status-cancelled"
          : "status-progress";
    return '<span class="status ' + className + '">' + s + "</span>";
  }
  function dateKey(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, "0"),
      String(date.getDate()).padStart(2, "0"),
    ].join("-");
  }
  function filterJobsByDate(period, singleDate, fromDate, toDate) {
    let from = "",
      to = "";
    const today = new Date();
    if (period === "today") {
      from = to = dateKey(today);
    } else if (period === "week") {
      const start = new Date(today);
      const day = start.getDay() || 7;
      start.setDate(start.getDate() - day + 1);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      from = dateKey(start);
      to = dateKey(end);
    } else if (period === "month") {
      from = dateKey(new Date(today.getFullYear(), today.getMonth(), 1));
      to = dateKey(new Date(today.getFullYear(), today.getMonth() + 1, 0));
    } else if (period === "single") {
      from = to = singleDate;
    } else if (period === "range") {
      from = fromDate;
      to = toDate;
    }
    return jobs.filter((job) => {
      const jobDate = dateKey(job.assignmentDate);
      const matchesDate =
        !from && !to
          ? true
          : Boolean(
              jobDate && from && (!to || jobDate <= to) && jobDate >= from,
            );
      return matchesDate;
    });
  }
  function getFilteredJobs() {
    const status = $("#assignmentStatusFilter").val() || "ทั้งหมด";
    const filteredByDate = filterJobsByDate(
      $("#assignmentDateFilter").val() || "all",
      $("#assignmentSingleDate").val(),
      $("#assignmentFromDate").val(),
      $("#assignmentToDate").val(),
    );
    return filteredByDate.filter(
      (job) => status === "ทั้งหมด" || job.status === status,
    );
  }
  function reportDateKey(value) {
    const text = String(value || "").trim();
    const thaiDate = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (thaiDate) {
      return [
        thaiDate[3],
        String(thaiDate[2]).padStart(2, "0"),
        String(thaiDate[1]).padStart(2, "0"),
      ].join("-");
    }
    return dateKey(text);
  }
  function syncResponsiveTableLabels() {
    document.querySelectorAll(".data-table").forEach((table) => {
      const labels = [...table.querySelectorAll("thead th")].map((th) =>
        th.textContent.trim(),
      );
      table.querySelectorAll("tbody tr").forEach((row) => {
        [...row.cells].forEach((cell, index) => {
          if (labels[index]) cell.dataset.label = labels[index];
        });
      });
    });
  }
  function renderReportRows() {
    const from = reportDateKey($("#reportFromDate").val());
    const to = reportDateKey($("#reportToDate").val());
    const filtered = jobs.filter((job) => {
      const value = reportDateKey(job.assignmentDate);
      return value && (!from || value >= from) && (!to || value <= to);
    });
    const cell = (value) => String(value || "-");
    $("#reportRows").html(
      filtered.length
        ? filtered
            .map(
              (job) =>
                "<tr><td>" +
                statusTag(job.status) +
                "</td><td>" +
                cell(job.id) +
                "</td><td>" +
                cell(job.supervisor) +
                "</td><td>" +
                cell(job.site) +
                "</td><td>" +
                cell(job.area) +
                "</td><td>" +
                cell(job.job) +
                "</td><td>" +
                cell(job.rank) +
                "</td><td>" +
                cell(job.date) +
                "</td><td>" +
                cell(job.foreman) +
                "</td></tr>",
            )
            .join("")
        : '<tr><td colspan="9" class="text-center text-muted py-8">ไม่พบข้อมูลในช่วงวันที่ที่เลือก</td></tr>',
    );
    $("#reportSummary").text(
      "พบ " + filtered.length + " งาน จากช่วงวันที่ที่เลือก",
    );
    refreshIcons();
    syncResponsiveTableLabels();
  }
  function updateAssignmentFilters() {
    const period = $("#assignmentDateFilter").val();
    $("#assignmentSingleDateWrap").toggleClass("hidden", period !== "single");
    $("#assignmentDateRange")
      .toggleClass("hidden", period !== "range")
      .toggleClass("flex", period === "range");
    renderRows();
  }
  function updateSubmitFilters() {
    const period = $("#submitDateFilter").val() || "all";
    $("#submitSingleDateWrap").toggleClass("hidden", period !== "single");
    $("#submitDateRange")
      .toggleClass("hidden", period !== "range")
      .toggleClass("flex", period === "range");
    renderSubmit();
  }
  function refreshIcons() {
    if (window.lucide && typeof window.lucide.createIcons === "function") {
      window.lucide.createIcons();
    }
  }
  function imageCell(fileId, url, label) {
    if (!fileId && !url) {
      return (
        '<span class="image-placeholder" aria-label="ยังไม่มี' +
        label +
        '"><i data-lucide="image-off" class="w-5 h-5" aria-hidden="true"></i></span>'
      );
    }
    const previewUrl = fileId
      ? "https://lh3.googleusercontent.com/d/" + fileId + "=s100-c"
      : url;
    const fullUrl = fileId
      ? "https://lh3.googleusercontent.com/d/" + fileId
      : url;
    return (
      '<button type="button" class="image-thumb" data-preview-image="' +
      fullUrl +
      '" data-preview-title="' +
      label +
      '" aria-label="เปิด' +
      label +
      'เต็มขนาด"><img src="' +
      previewUrl +
      '" alt="' +
      label +
      '" data-export-file-id="' +
      (fileId || "") +
      '" loading="lazy" /></button>'
    );
  }
  function renderEditImagePreview(selector, fileId, url, label) {
    const container = document.querySelector(selector);
    if (!container) return;
    container.replaceChildren();
    if (!fileId && !url) {
      const placeholder = document.createElement("div");
      placeholder.className = "image-placeholder w-full !h-[180px]";
      placeholder.setAttribute("aria-label", "ยังไม่มี" + label);
      placeholder.innerHTML = '<i data-lucide="image-off" class="w-7 h-7" aria-hidden="true"></i>';
      container.appendChild(placeholder);
      return;
    }
    const previewUrl = fileId ? "https://lh3.googleusercontent.com/d/" + fileId + "=s600-c" : url;
    const fullUrl = fileId ? "https://lh3.googleusercontent.com/d/" + fileId : url;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "edit-image-preview";
    button.dataset.previewImage = fullUrl;
    button.dataset.previewTitle = label;
    button.setAttribute("aria-label", "เปิด" + label + "เต็มขนาด");
    const image = document.createElement("img");
    image.src = previewUrl;
    image.alt = label;
    image.loading = "lazy";
    button.appendChild(image);
    container.appendChild(button);
  }
  function renderRows() {
    const filteredJobs = getFilteredJobs();
    const jobRow = (j) =>
      "<tr><td>" +
      statusTag(j.status) +
      '</td><td><button type="button" class="font-semibold text-brand hover:underline" data-submit-job="' +

      '">' +
      j.id +
      "</button></td><td>" +

      "</td><td>" +
      (j.site || "-") +
      "</td><td>" +
      (j.area || "-") +
      '</td><td><div class="font-semibold">' +
      (j.job || "-") +
      '</div></td><td><span class="font-semibold">' +
      (j.rank || "-") +
      "</span></td><td>" +
      j.date +
      "</td><td>" +
      (j.foreman || "-") +
      "</td><td>" +
      imageCell(j.beforeFileId, j.beforeUrl, "ภาพก่อน") +
      "</td><td>" +
      imageCell(j.afterFileId, j.afterUrl, "ภาพหลัง") +
      "</td></tr>";
    const assignmentHtml = filteredJobs.map(jobRow).join("");
    const recentHtml = jobs.slice(0, 5).map(jobRow).join("");
    $("#assignmentRows").html(
      assignmentHtml ||
        '<tr><td colspan="11" class="text-center text-muted py-8">ไม่พบงานตามเงื่อนไขที่เลือก</td></tr>',
    );
    $("#assignmentCount").text(
      filteredJobs.length + " จาก " + jobs.length + " รายการ",
    );
    $("#recentRows").html(recentHtml);
    refreshIcons();
    syncResponsiveTableLabels();
  }
  const selectedFiles = {};
  const previewUrls = {};
  let uploadToken = null;
  const uploadFolderPromises = {};
  let uploadLibrariesPromise = null;
  function getUploadAuth(jobId) {
    if (!jobId)
      return Promise.reject(
        new Error("ไม่พบรหัสงานสำหรับเตรียมโฟลเดอร์อัปโหลด"),
      );
    if (uploadFolderPromises[jobId]) return uploadFolderPromises[jobId];
    if (!window.google || !google.script)
      return Promise.reject(
        new Error("กรุณาเปิดผ่าน Google Apps Script Web App"),
      );
    uploadFolderPromises[jobId] = new Promise((resolve, reject) =>
      google.script.run
        .withSuccessHandler((r) => {
          uploadToken = uploadToken || r.accessToken;
          resolve({ accessToken: uploadToken, folderId: r.folderId });
        })
        .withFailureHandler(reject)
        .getUploadAuth(jobId),
    );
    return uploadFolderPromises[jobId];
  }

  function compressSelected(file, pct, label) {
    const isHeic =
      /\.(heic|heif)$/i.test(file.name) || /image\/heic/i.test(file.type);
    const converted = isHeic
      ? heic2any({ blob: file, toType: "image/jpeg", quality: 0.7 }).then(
          (blob) =>
            new File([blob], file.name.replace(/\.(heic|heif)$/i, ".jpg"), {
              type: "image/jpeg",
            }),
        )
      : Promise.resolve(file);
    return converted.then(
      (input) =>
        new Promise(
          (resolve, reject) =>
            new Compressor(input, {
              quality: 0.65,
              maxWidth: 1600,
              maxHeight: 1600,
              convertSize: 500000,
              success: (output) => {
                // in MB
                console.log(
                  "[FieldFlow] " +
                    file.name +
                    " | ก่อนบีบอัด: " +
                    (input.size / 1024 / 1024).toFixed(2) +
                    " MB | หลังบีบอัด: " +
                    (output.size / 1024 / 1024).toFixed(2) +
                    " MB",
                );
                // bar.css("width", (bar.css("width") + 5) + "%");
                let bar = $('.upload-step[data-step="prepare"]').find(
                  ".upload-step-fill",
                );
                bar.css("width", parseInt(bar.css("width") || "0") + 50 + "%");
                pct.text(parseInt(pct.text()) + 5 + "%");
                label.text("กำลังบีบอัด...");
                resolve(output);
              },
              error: reject,
            }),
        ),
    );
  }

  function uploadToDrive(file, token, folderId, kind) {
    console.log("[FieldFlow upload] start uploading", file.name, kind);
    let progressBar = $('.upload-step[data-step="' + kind + '"]').find(
      ".upload-step-fill",
    );
    let chunkSize = file.size > 5 * 1024 * 1024 ? 1024 * 1024 : 512 * 1024; // 5 MB ขึ้นไปใช้ chunk 1 MB, น้อยกว่าใช้ chunk 512 KB
    let intervalId = setInterval(() => {
      const currentWidth = parseFloat(progressBar.css("width")) || 0;
      const parentWidth = parseFloat(progressBar.parent().css("width")) || 1;
      const currentPercent = (currentWidth / parentWidth) * 100;
      const newPercent = Math.min(99, currentPercent + 1);
      progressBar.css("width", newPercent + "%");
    }, 300);
    return new Promise((resolve, reject) => {
      const ru = new ResumableUploadToGoogleDrive2();
      ru.Do(
        {
          file,
          accessToken: token,
          folderId,
          fields: "id",
          chunkSize: chunkSize,
        },
        (res, err) => {
          if (err) {
            console.error("[FieldFlow upload] error", file.name, err);
            reject(err);
            return;
          }
          console.log("[FieldFlow upload] callback", file.name, {
            status: res?.status,
            progressByte: res?.progressByte,
            progressNumber: res?.progressNumber,
            kind: kind,
          });
          if (res.status === "Uploading") {
            const current = Number(
              res.progressByte?.current ?? res.progressNumber?.current ?? 0,
            );
            const total = Number(
              res.progressByte?.total ?? res.progressNumber?.end ?? 0,
            );
            const p = total > 0 ? Math.round((current / total) * 100) : 0;
            console.log(
              "[FieldFlow upload] progress",
              file.name,
              (current / 1024 / 1024).toFixed(2) +
                " MB/" +
                (total / 1024 / 1024).toFixed(2) +
                " MB",
              p + "%",
            );
            progressBar.css("width", p + "%");
          }
          if (res.status === "Done") {
            clearInterval(intervalId);
            console.log("[FieldFlow upload] done", file.name, res.result);
            progressBar.css("width", "100%");
            resolve(res.result);
          }
        },
      );
    });
  }

  function renderSubmit() {
    const filteredJobs = filterJobsByDate(
      $("#submitDateFilter").val() || "all",
      $("#submitSingleDate").val(),
      $("#submitFromDate").val(),
      $("#submitToDate").val(),
    );
    const html = filteredJobs
      .map(
        (j) =>
          '<tr data-job-id="' +
          j.id +
          '">' +
          "<td>" +
          statusTag(j.status) +
          '</td><td><button type="button" class="font-semibold text-brand hover:underline" data-submit-job="' +
          j.id +
          '">' +
          j.id +
          "</button></td>" +
          "<td>" +
          (j.supervisor || "-") +
          "</td><td>" +
          (j.site || "-") +
          "</td><td>" +
          (j.area || "-") +
          '</td><td><div class="font-semibold">' +
          (j.job || "-") +
          "</div></td><td>" +
          (j.rank || "-") +
          "</td><td>" +
          j.date +
          "</td><td>" +
          (j.foreman || "-") +
          "</td>" +
          "<td>" +
          imageCell(j.beforeFileId, j.beforeUrl, "ภาพก่อน") +
          "</td><td>" +
          imageCell(j.afterFileId, j.afterUrl, "ภาพหลัง") +
          "</td>" +
          "<td>" +
          (j.status === "In progress"
            ? '<button type="button" class="btn-primary rounded-lg h-9 px-3 text-xs font-semibold open-submit-modal">ส่งงาน</button>'
            : '<span class="text-xs text-muted">-</span>') +
          "</td>" +
          "</tr>",
      )
      .join("");
    $("#submitList").html(
      html ||
        '<tr><td colspan="12" class="text-center text-muted py-8">ไม่พบงานตามเงื่อนไขที่เลือก</td></tr>',
    );
    refreshIcons();
    syncResponsiveTableLabels();
  }

  function toast(msg, placement, duration = 2500) {
    const toastElement = $("#toast");
    if (toastTimer) clearTimeout(toastTimer);
    toastElement
      .toggleClass("toast-top", placement === "top")
      .addClass("show");
    $("#toastMessage").text(msg);
    toastTimer = setTimeout(() => {
      closeToast();
    }, duration);
  }
  function closeToast() {
    if (toastTimer) clearTimeout(toastTimer);
    $("#toast").removeClass("show toast-top");
    toastTimer = null;
  }
  function renderNotifications(payload) {
    let data = payload;
    if (typeof data === "string") {
      try {
        data = JSON.parse(data);
      } catch (error) {
        data = null;
      }
    }
    data = data || { items: [], unreadCount: 0 };
    const previousNotifications = notifications;
    const previousNotificationIds = new Set(
      previousNotifications.map((notification) =>
        String(notification.NotificationId || ""),
      ),
    );
    const nextNotifications = data.items || [];
    const unreadCount = Number(data.unreadCount) || 0;
    const previousUnreadCount = notificationUnreadCount;
    notificationUnreadCount = unreadCount;
    const newNotifications =
      previousUnreadCount === null
        ? []
        : nextNotifications.filter(
            (notification) =>
              !previousNotificationIds.has(
                String(notification.NotificationId || ""),
              ),
          );
    notifications = nextNotifications;
    if (previousUnreadCount !== null && newNotifications.length) {
      const details = newNotifications
        .slice(0, 3)
        .map((notification) =>
          [notification.Title, notification.Message].filter(Boolean).join("\n"),
        )
        .join("\n\n");
      toast(
        "มีการแจ้งเตือนใหม่" +
          (newNotifications.length > 1
            ? " " + newNotifications.length + " รายการ"
            : "") +
          "\n" +
          details,
        "top",
        15000,
      );
    }
    $("#notificationBadge")
      .text(unreadCount > 99 ? "99+" : unreadCount)
      .toggleClass("hidden", unreadCount === 0);
    const list = $("#notificationList").empty();
    if (!notifications.length) {
      list.append(
        $(
          '<div class="p-6 text-center text-sm text-muted">ยังไม่มีการแจ้งเตือน</div>',
        ),
      );
      return;
    }
    notifications.forEach((notification) => {
      const item = $("<button type='button'>", { class: "notification-item" })
        .toggleClass("unread", !notification.IsRead)
        .attr("data-notification-id", notification.NotificationId)
        .attr("data-assignment-id", notification.AssignmentId);
      $("<div>", { class: "flex items-start gap-2" })
        .append(
          $("<span>", {
            class: "mt-1 w-2 h-2 rounded-full bg-brand flex-none",
          }).toggleClass("invisible", notification.IsRead),
          $("<span>", { class: "font-semibold text-sm" }).text(
            notification.Title,
          ),
        )
        .appendTo(item);
      $("<div>", { class: "text-xs text-muted mt-1 pl-4 text-left" })
        .text(notification.Message)
        .appendTo(item);
      item.appendTo(list);
    });
  }

  function startNotificationPolling() {

  function showTab(tab, scrollTargetId) {
    $(".tab-panel").removeClass("active");
    $("#" + tab).addClass("active");
    $(".nav-item").removeClass("active");
    $(".nav-item[data-tab='" + tab + "']").addClass("active");
    $(".mobile-nav button").removeClass("active");
    $(".mobile-nav button[data-tab='" + tab + "']").addClass("active");
    if (!scrollTargetId) {
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }
    window.requestAnimationFrame(() => {
      const target = document.getElementById(scrollTargetId);
      const scrollContainer = target?.closest(".table-wrap") || target;
      if (!scrollContainer) return;
      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;
      scrollContainer.scrollIntoView({
        behavior: prefersReducedMotion ? "auto" : "smooth",
        block: "start",
      });
    });
  }
  function uploadImagesTogether(files, token, folderId) {
    return Promise.all(
      Object.entries(files)
        .filter(([, file]) => file)
        .map(([kind, file]) => {
        file = new File([file], "[" + kind + "] " + file.name, {
          type: file.type,
        });
        return uploadToDrive(file, token, folderId, kind).then((result) => ({
          kind,
          result,
        }));
        }),
    ).then((items) =>
      Object.fromEntries(items.map((item) => [item.kind, item.result])),
    );
  }

  function editOptionValues(selector, values, selected) {

    if (!select) return;
    select.replaceChildren(new Option("เลือก...", ""));
    [...new Set(values.filter(Boolean))].forEach((value) =>
      select.appendChild(new Option(value, value)),
    );
    select.value = values.includes(selected) ? selected : "";
  }

  function openSubmitModal(jobId) {

    if (!job) return;
    const submitDialog = document.getElementById("submitUploadDialog");
    if (submitDialog.parentElement !== document.body)
      document.body.appendChild(submitDialog);
    if (submitDialog.open) submitDialog.close();
    const modal = $("#submitUploadDialog")
      .attr("data-job-id", job.id)
      .data("job-id", job.id);
    $("#submitModalTitle").text(job.id + " · " + (job.job || "งานภาคสนาม"));
    $("#submitModalMeta").text(
      (job.site || "-") + " · " + (job.area || "-") + " · " + job.date,
    );
    $("#submitBeforeNote").val(job.beforeNote || "");
    $("#submitAfterNote").val(job.afterNote || "");
    $("#submitBeforeFile, #submitAfterFile").val("");
    $("#submitBeforePreview, #submitAfterPreview").addClass("hidden");
    $(
      "#submitBeforePreviewPlaceholder, #submitAfterPreviewPlaceholder",
    ).removeClass("hidden");
    ["before", "after"].forEach((kind) => {
      const file = selectedFiles[job.id]?.[kind];
      if (file) updateSubmitPreview(kind, file);
      else if (job[kind + "FileId"] || job[kind + "Url"])
        showRemoteSubmitPreview(kind, job[kind + "FileId"], job[kind + "Url"]);
    });
    const canSubmit =
      window.FIELD_FLOW_USER.Role === "Foreman" &&
      job.status !== "Cancelled" &&
      job.status !== "Success";
    $(
      "#submitUploadDialog input[type=file], #submitUploadDialog textarea",
    ).prop("disabled", !canSubmit);
    $("#submitModalUpload")
      .prop("disabled", !canSubmit)
      .text(job.status === "Success" ? "งานนี้เสร็จสิ้นแล้ว" : "บันทึกภาพที่เลือก");

          : "ดูรายละเอียดเท่านั้น",

    if (canSubmit) prepareSubmitButton(job.id);
    submitDialog.showModal();
    refreshIcons();

  function updateSubmitPreview(kind, file) {
    if (previewUrls[kind]) URL.revokeObjectURL(previewUrls[kind]);
    previewUrls[kind] = URL.createObjectURL(file);
    $(
      "#submit" + kind.charAt(0).toUpperCase() + kind.slice(1) + "Preview",
    ).attr("src", previewUrls[kind]);
    $(
      "#submit" + kind.charAt(0).toUpperCase() + kind.slice(1) + "Preview",
    ).removeClass("hidden");
    $(
      "#submit" +
        kind.charAt(0).toUpperCase() +
        kind.slice(1) +
        "PreviewPlaceholder",
    ).addClass("hidden");
    $("#submit" + kind.charAt(0).toUpperCase() + kind.slice(1) + "File")
      .closest("label")
      .find("span")
      .text(file.name.length > 18 ? file.name.slice(0, 15) + "…" : file.name);
  }
  function showRemoteSubmitPreview(kind, fileId, url) {

    const previewUrl = fileId
      ? "https://lh3.googleusercontent.com/d/" + fileId + "=s1000"
      : url;
    $("#submit" + name + "Preview")
      .attr("src", previewUrl)
      .removeClass("hidden");
    $("#submit" + name + "PreviewPlaceholder").addClass("hidden");

    function base64ToBlob(base64, mimeType) {
      const binary = atob(base64);
      const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
      return new Blob([bytes], { type: mimeType });
    }

    function getImageDimensions(blob) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(blob);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(objectUrl);
          resolve({ width: image.naturalWidth, height: image.naturalHeight });
        };
        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("อ่านขนาดรูปภาพไม่สำเร็จ"));
        };
        image.src = objectUrl;
      });
    }

    function containImage(image, box) {
      const scale = Math.min(
        box.width / image.width,
        box.height / image.height,
      );
      return {
        width: Math.max(1, Math.round(image.width * scale)),
        height: Math.max(1, Math.round(image.height * scale)),
      };
    }

    function centeredImagePlacement(
      image,
      box,
      anchor,
      columnPixelWidths,
      columnWidths,
      rowPixelHeight,
      rowHeightPoints,
    ) {
      const size = containImage(image, box);
      const offsetX = (box.width - size.width) / 2;
      const offsetY = (box.height - size.height) / 2;
      let remainingX = Math.max(0, offsetX);
      let nativeCol = anchor.col;
      while (
        nativeCol < anchor.col + columnPixelWidths.length - 1 &&
        remainingX >= columnPixelWidths[nativeCol - anchor.col]
      ) {
        remainingX -= columnPixelWidths[nativeCol - anchor.col];
        nativeCol += 1;
      }
      return {
        tl: {
          nativeCol,
          nativeColOff: Math.max(
            0,
            Math.round(
              (remainingX / columnPixelWidths[nativeCol - anchor.col]) *
                columnWidths[nativeCol - anchor.col] *
                10000,
            ),
          ),
          nativeRow: anchor.row,
          nativeRowOff: Math.max(
            0,
            Math.round((offsetY / rowPixelHeight) * rowHeightPoints * 10000),
          ),
        },
        ext: size,
        editAs: "oneCell",
      };
    }

    async function fetchExportImage(fileId) {
      if (!fileId) return null;
      const image = await new Promise((resolve, reject) =>
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getExportImageBase64(fileId, getStoredSessionToken()),
      );
      if (!image || !image.base64) return null;
      const blob = base64ToBlob(image.base64, image.mimeType);
      return {
        base64: image.base64,
        dimensions: await getImageDimensions(blob),
        extension: image.extension,
      };
    }

    function fetchCachedExportImage(fileId) {
      if (!fileId) return Promise.resolve(null);
      if (exportImageCache.has(fileId)) return exportImageCache.get(fileId);
      const startedAt = performance.now();
      const imagePromise = fetchExportImage(fileId)
        .then((image) => {
          console.debug(
            "[FieldFlow export] image",
            fileId,
            Math.round(performance.now() - startedAt) + " ms",
          );
          if (image) exportImageCache.set(fileId, Promise.resolve(image));
          else exportImageCache.delete(fileId);
          return image;
        })
        .catch((error) => {
          exportImageCache.delete(fileId);
          throw error;
        });
      exportImageCache.set(fileId, imagePromise);
      return imagePromise;
    }

    function getReportWeekInfo(job) {
      const value = new Date(job.assignmentDate);
      if (Number.isNaN(value.getTime()) || value.getDay() === 0) return null;
      const month = value.toLocaleString("en-US", { month: "long" }).toUpperCase();
      const firstDay = new Date(value.getFullYear(), value.getMonth(), 1);
      const mondayOffset = (firstDay.getDay() + 6) % 7;
      const week = Math.floor((value.getDate() - 1 + mondayOffset) / 7) + 1;
      const monday = new Date(value);
      const dayOffset = (monday.getDay() + 6) % 7;
      monday.setDate(monday.getDate() - dayOffset);
      const saturday = new Date(monday);
      saturday.setDate(saturday.getDate() + 5);
      const monthStart = new Date(value.getFullYear(), value.getMonth(), 1);
      const monthEnd = new Date(value.getFullYear(), value.getMonth() + 1, 0);
      const rangeStart = monday < monthStart ? monthStart : monday;
      const rangeEnd = saturday > monthEnd ? monthEnd : saturday;
      const formatDate = (date) =>
        date
          .toLocaleDateString("en-US", {
            day: "2-digit",
            month: "long",
            year: "numeric",
          })
          .toUpperCase();
      return {
        key: value.getFullYear() + "-" + value.getMonth() + "-" + week,
        label: month + "-WEEK#" + week,
        dateRange: formatDate(rangeStart) + " - " + formatDate(rangeEnd),
        sortKey: rangeStart.getTime(),
      };
    }

  function stopSessionActivity() {
    if (sessionIdleTimer) clearTimeout(sessionIdleTimer);
    sessionIdleTimer = null;
    if (sessionActivityHandler) {

  function startSessionActivity() {
    stopSessionActivity();
    const markActivity = () => {
      const token = getStoredSessionToken();
      if (!token || !window.FIELD_FLOW_USER) return;
      if (sessionIdleTimer) clearTimeout(sessionIdleTimer);
      sessionIdleTimer = setTimeout(expireSession, SESSION_IDLE_MS);
      const now = Date.now();
      if (now - lastSessionTouch < SESSION_TOUCH_INTERVAL_MS) return;
      lastSessionTouch = now;
      google.script.run.withFailureHandler(expireSession).touchSession(token);
    };
    sessionActivityHandler = markActivity;
    ["click", "keydown", "scroll", "touchstart"].forEach((eventName) =>
      document.addEventListener(eventName, markActivity, { passive: true }),
    );
    markActivity();
  }
  function getUserInitials(name, username) {
    const value = String(name || username || "").trim();
    if (!value) return "?";
    const words = value.split(/\s+/).filter(Boolean);
    const firstCharacter = (word) => {
      const characters = Array.from(word);
      return (
        characters.find((character) => /[ก-ฮ]/u.test(character)) ||
        characters.find((character) => /[A-Za-z]/u.test(character)) ||
        characters.find((character) => /[\p{L}\p{N}]/u.test(character)) ||
        ""
      );
    };
    const initials =
    words.length > 1
        ? firstCharacter(words[0]) + firstCharacter(words[words.length - 1])
        : Array.from(words[0])
            .filter((character) => /[ก-ฮA-Za-z]/u.test(character))
            .slice(0, 2)
            .join("");
    return initials || "?";
  }

                  .map((input) => input.dataset.name)
                  .join(", "),
                status: "In progress",
              });
              updateSummary();
              renderRows();
              clearAssignmentForm();
              setAssignmentLoading(false);
            })
            .withFailureHandler((err) => {
              setAssignmentLoading(false);
              toast(err.message || "บันทึกงานไม่สำเร็จ");
            })
            .saveAssignment(payload);
          return;
        }
        const submit = e.target.closest("#submitModalUpload");
        if (submit) {
          e.stopImmediatePropagation();
          const card = $(submit).closest("[data-job-id]"),
            jobId = card.data("job-id") || $("#submitUploadDialog").data("job-id"),
            files = {
              before: $("#submitBeforeFile")[0]?.files[0],
              after: $("#submitAfterFile")[0]?.files[0],
            };
          console.log("Submitting job", jobId, files);
          if (
            !window.FIELD_FLOW_USER ||
            window.FIELD_FLOW_USER.Role !== "Foreman"
          ) {
            toast("เฉพาะ Foreman เท่านั้นที่ส่งงานได้");
            return;
          }
          if (!files.before && !files.after) {
            toast("กรุณาเลือกภาพก่อนหรือภาพหลังอย่างน้อย 1 ภาพ");
            return;
          }
          submit.disabled = true;
          submit.textContent = "กำลังอัปโหลด...";
          const status = card.find(".upload-status").removeClass("hidden"),
            pct = card.find(".upload-percent"),
            label = card.find(".upload-label");
          (async () => {
            let intervalId = null;
            try {
              label.text("กำลังเตรียมไฟล์...");
              await window.FieldFlowLoaders.loadUpload();
              if (files.before)
                files.before = await compressSelected(files.before, pct, label);
              if (files.after)
                files.after = await compressSelected(files.after, pct, label);
              const uploadAuth = await getUploadAuth(jobId),
                auth = uploadAuth.accessToken,
                folderId = uploadAuth.folderId;
              pct.text("10%");
              label.text("กำลังอัปโหลดภาพ...");
              const uploadResults = await uploadImagesTogether(
                files,
                auth,
                folderId,
              );
              const beforeResult = uploadResults.before;
              const afterResult = uploadResults.after;
              console.log("Upload results:", uploadResults);
              pct.text("90%");
              label.text("กำลังบันทึกข้อมูลลงชีต...");
              let progressBar = $('.upload-step[data-step="save"]').find(
                ".upload-step-fill",
              );
              intervalId = setInterval(() => {
                const currentWidth = parseFloat(progressBar.css("width")) || 0;
                const parentWidth =
                  parseFloat(progressBar.parent().css("width")) || 1;
                const currentPercent = (currentWidth / parentWidth) * 100;
                const newPercent = Math.min(99, currentPercent + 1);
                progressBar.css("width", newPercent + "%");
              }, 300);
              const saved = await new Promise((resolve, reject) =>
                google.script.run
                  .withSuccessHandler(resolve)
                  .withFailureHandler(reject)
                  .saveSubmission({
                    username: window.FIELD_FLOW_USER.Username,
                    assignmentId: jobId,
                    ...(beforeResult
                      ? {
                          beforeFileId: beforeResult.id,
                          beforeUrl:
                            "https://drive.google.com/open?id=" + beforeResult.id,
                          beforeNote: $("#submitBeforeNote").val().trim(),
                        }
                      : {}),
                    ...(afterResult
                      ? {
                          afterFileId: afterResult.id,
                          afterUrl:
                            "https://drive.google.com/open?id=" + afterResult.id,
                          afterNote: $("#submitAfterNote").val().trim(),
                        }
                      : {}),
                  }),
              );
              clearInterval(intervalId);
              progressBar.css("width", "100%");
              pct.text("100%");
              label.text(saved.status === "Success" ? "ส่งงานสำเร็จ" : "บันทึกภาพสำเร็จ");
              toast(
                saved.status === "Success"
                  ? "อัปโหลดและส่งงาน " + jobId + " เรียบร้อยแล้ว"
                  : "บันทึกภาพที่เลือกของงาน " + jobId + " แล้ว",
              );
              const submittedBeforeNote = $("#submitBeforeNote").val().trim();
              const submittedAfterNote = $("#submitAfterNote").val().trim();
              const submittedJob = jobs.find(
                (job) => String(job.id) === String(jobId),
              );
              if (submittedJob) {
                submittedJob.status = saved.status || "In progress";
                if (beforeResult) {
                  submittedJob.beforeFileId = beforeResult.id;
                  submittedJob.beforeUrl =
                    "https://drive.google.com/open?id=" + beforeResult.id;
                  submittedJob.beforeNote = submittedBeforeNote;
                }
                if (afterResult) {
                  submittedJob.afterFileId = afterResult.id;
                  submittedJob.afterUrl =
                    "https://drive.google.com/open?id=" + afterResult.id;
                  submittedJob.afterNote = submittedAfterNote;
                }
              }
              // Close the native dialog instead of hiding it with jQuery. Hiding an
              // open dialog leaves its modal backdrop active and blocks the page.
              setTimeout(() => {
                closeSubmitModal();
                updateSummary();
                renderRows();
                renderSubmit();
              }, 700);
            } catch (err) {
              if (intervalId) clearInterval(intervalId);
              label.text("อัปโหลดไม่สำเร็จ");
              toast(err.message || "อัปโหลดไม่สำเร็จ");
              submit.disabled = false;
              submit.textContent = "บันทึกภาพที่เลือก";
            }
          })();
        }
      },
      true,
    );
    const sessionToken = getStoredSessionToken();
    if (sessionToken && window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function (user) {
          if (user) loadUserSession(user);
          else {
            clearStoredSessionToken();
            finishSessionCheck(true);
          }
        })
        .withFailureHandler(function () {
          clearStoredSessionToken();
          finishSessionCheck(true);
        })
        .getSession(sessionToken);
    }
  }
  $(document).ready(bootApp);
</script>
