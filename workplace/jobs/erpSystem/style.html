<!-- Shared ERP presentation layer. Global tokens belong here as the UI is migrated from index.html. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap');

  :root {
    --erp-surface: #ffffff;
    --erp-surface-muted: #f8fafc;
    --erp-surface-raised: #f1f5f9;
    --erp-ink: #1e293b;
    --erp-ink-muted: #334155;
    --erp-ink-subtle: #475569;
    --erp-border: #e2e8f0;
    --erp-border-strong: #cbd5e1;
    --erp-focus: #0284c7;
    --erp-primary: #0284c7;
    --erp-primary-strong: #0369a1;
    --erp-danger: #e11d48;
    --erp-success: #15803d;
    --erp-radius-control: 0.5rem;
    --erp-radius-panel: 0.75rem;
    --erp-shadow-panel: 0 8px 14px rgb(15 23 42 / 0.06);
    --erp-font-sans: 'Noto Sans Thai', sans-serif;
    --erp-font-heading: 'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif;
    --erp-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --erp-motion-fast: 150ms ease-out;
  }

  html {
    overflow-x: hidden;
    background: #f8fafc;
    font-size: 16px;
  }

  body {
    min-width: 0;
    font-family: var(--erp-font-sans);
    color: var(--erp-ink);
    background:
      radial-gradient(circle at top, rgb(14 165 233 / 0.10), transparent 34%),
      linear-gradient(180deg, #f8fbff 0%, #f8fafc 38%, #eef2f7 100%);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }

  .font-mono,
  td.text-right,
  .cart-total-price,
  .bill-total-val,
  .grand-price {
    font-variant-numeric: tabular-nums;
  }

  .erp-panel {
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid var(--erp-border);
    border-radius: var(--erp-radius-panel);
    box-shadow: var(--erp-shadow-panel);
  }

  .erp-surface-card {
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid var(--erp-border);
    border-radius: var(--erp-radius-panel);
    box-shadow: var(--erp-shadow-panel);
  }

  .erp-toolbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    background: rgba(248, 250, 252, 0.92);
    border: 1px solid var(--erp-border);
    border-radius: var(--erp-radius-control);
    padding: 0.625rem;
  }

  .erp-control {
    min-height: 2.75rem;
    border: 1px solid var(--erp-border-strong);
    border-radius: var(--erp-radius-control);
    color: var(--erp-ink);
    background: var(--erp-surface);
    transition: border-color var(--erp-motion-fast), box-shadow var(--erp-motion-fast);
  }

  .erp-control:focus {
    border-color: var(--erp-focus);
    box-shadow: 0 0 0 3px rgb(2 132 199 / 0.16);
    outline: 0;
  }

  .erp-action {
    min-height: 2.75rem;
    border-radius: var(--erp-radius-control);
    font-weight: 700;
    transition: background-color var(--erp-motion-fast), color var(--erp-motion-fast), border-color var(--erp-motion-fast), transform var(--erp-motion-fast);
  }

  .erp-action-primary {
    color: #ffffff !important;
    background: var(--erp-primary);
  }

  .erp-action-primary:hover {
    background: var(--erp-primary-strong);
  }

  .erp-action-danger {
    color: #9f1239 !important;
    background: #fff1f2;
    border: 1px solid #fecdd3;
  }

  .erp-action-danger:hover {
    background: #ffe4e6;
  }

  .erp-action-secondary {
    color: #334155 !important;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    font-weight: 700 !important;
  }

  .erp-action-secondary:hover {
    color: #0f172a !important;
    background: #e2e8f0;
    border-color: #94a3b8;
  }

  .erp-icon-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.75rem;
    min-height: 2.75rem;
    border-radius: var(--erp-radius-control);
  }

  .erp-main-content .tracking-wider {
    letter-spacing: 0.025em;
  }

  .erp-main-content .font-bold {
    font-weight: 600;
  }

  .erp-main-content .font-extrabold {
    font-weight: 600;
  }

  .erp-main-content .font-black {
    font-weight: 700;
  }

  .erp-main-content .text-slate-400 {
    color: var(--erp-ink-subtle) !important;
  }

  .erp-main-content :is(h1, h2, h3, h4) {
    font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif;
    color: var(--erp-ink);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.1;
    text-wrap: balance;
    font-kerning: normal;
  }

  .erp-main-content h1 {
    font-size: clamp(1.5rem, 1.1rem + 0.9vw, 2rem);
  }

  .erp-main-content h2 {
    font-size: clamp(1.125rem, 0.98rem + 0.35vw, 1.375rem);
  }

  .erp-main-content h3 {
    font-size: clamp(1rem, 0.95rem + 0.16vw, 1.1rem);
  }

  .erp-main-content h4 {
    font-size: 0.95rem;
    font-weight: 600;
  }

  .erp-action:disabled,
  .erp-control:disabled {
    cursor: wait;
    opacity: 0.62;
  }

  .erp-action:active:not(:disabled) {
    transform: translateY(1px);
  }

  .nav-btn {
    min-height: 2.75rem;
    transition: background-color var(--erp-motion-fast), color var(--erp-motion-fast), border-color var(--erp-motion-fast);
  }

  .erp-main-content :is(input:not([type="hidden"]), select) {
    height: 2.5rem;
    min-height: 2.5rem;
    border-color: var(--erp-border-strong);
    color: var(--erp-ink);
  }

  .erp-main-content textarea {
    width: 100%;
    min-height: 5.5rem;
    border-color: var(--erp-border-strong);
    color: var(--erp-ink);
  }

  input:not([type="hidden"]),
  select {
    height: 2.5rem;
    min-height: 2.5rem;
  }

  textarea {
    width: 100% !important;
  }

  .erp-main-content :is(input:not([type="hidden"]), select, textarea)::placeholder {
    color: var(--erp-ink-subtle);
    opacity: 1;
  }

  .erp-main-content :is(input:not([type="hidden"]), select, textarea):focus {
    border-color: var(--erp-focus);
    box-shadow: 0 0 0 3px rgb(2 132 199 / 0.16);
    outline: 0;
  }

  .erp-main-content table tbody tr {
    transition: background-color var(--erp-motion-fast);
  }

  .erp-main-content table tbody tr:focus-within {
    background: #f0f9ff;
  }

  .erp-main-content table :is(th, td) {
    font-size: 0.9375rem !important;
  }

  .erp-main-content table :is(button, .text-xs, .text-\[10px\]) {
    font-size: 0.9375rem !important;
  }

  [role="dialog"] :is(label, .text-xs, .text-\[10px\]):not(button, button *) {
    font-size: 0.75rem !important;
    color: #475569 !important;
    font-weight: 700 !important;
  }

  [role="dialog"] :is(input:not([type="hidden"]), select, textarea) {
    font-size: 0.8125rem !important;
    color: #0f172a !important;
  }

  [role="dialog"] .cart-type-select,
  [role="dialog"] .cart-prod-select,
  [role="dialog"] .cart-unit-select,
  [role="dialog"] .cart-qty-input,
  [role="dialog"] .cart-custom-name,
  [role="dialog"] .cart-custom-price,
  [role="dialog"] .cart-custom-cost,
  [role="dialog"] .tier-min,
  [role="dialog"] .tier-max,
  [role="dialog"] .tier-price {
    font-size: 0.75rem !important;
  }

  .erp-main-content .owner-only-metric.hidden {
    display: none !important;
  }

  .erp-data-cell {
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .erp-table-region {
    contain: content;
  }

  .splash-mark {
    animation: splash-bob 1.8s ease-in-out infinite;
  }

  .splash-track {
    position: relative;
    overflow: hidden;
    background: #e2e8f0;
  }

  .splash-track::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.78), transparent);
    animation: splash-shimmer 1.35s ease-in-out infinite;
  }

  @keyframes splash-shimmer {
    to {
      transform: translateX(100%);
    }
  }

  @keyframes splash-bob {

    0%,
    100% {
      transform: translateY(0) scale(1);
    }

    50% {
      transform: translateY(-3px) scale(1.02);
    }
  }

  .erp-skeleton {
    position: relative;
    overflow: hidden;
    background: #e2e8f0;
    color: transparent !important;
    border-color: transparent !important;
    box-shadow: none !important;
    pointer-events: none;
    user-select: none;
  }

  .erp-skeleton::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.8), transparent);
    animation: splash-shimmer 1.2s ease-in-out infinite;
  }

  .erp-skeleton-circle {
    border-radius: 9999px;
  }

  .erp-skeleton-line {
    border-radius: 9999px;
    min-height: 0.75rem;
  }

  .erp-skeleton-block {
    border-radius: 0.5rem;
    min-height: 1rem;
  }

  :focus-visible {
    outline: 2.5px solid var(--erp-focus);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px rgb(2 132 199 / 0.2);
  }

  @media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }

    .erp-skeleton::after {
      animation: none;
      opacity: 0.4;
    }
  }

  @media (pointer: coarse) {

    button,
    select,
    input:not([type="hidden"]) {
      min-height: 44px;
    }

    button {
      touch-action: manipulation;
    }
  }

  @media (max-width: 767px) {
    body {
      padding-inline: env(safe-area-inset-left) env(safe-area-inset-right);
    }

    header>div,
    .erp-main-shell {
      padding-inline: 0.75rem !important;
    }

    .erp-main-shell {
      padding-block: 0.75rem !important;
      gap: 0.75rem !important;
    }

    .erp-main-content {
      padding: 0.875rem !important;
      border-radius: 0.75rem !important;
    }

    .erp-sidebar-panel {
      position: static !important;
      padding: 0.5rem !important;
    }

    .erp-sidebar-panel>div:first-child,
    .erp-sidebar-panel>div:last-child {
      display: none;
    }

    .erp-sidebar-panel nav {
      display: grid !important;
      grid-template-columns: repeat(5, minmax(3.25rem, 1fr));
      overflow-x: auto;
      padding-bottom: 0 !important;
    }

    .erp-sidebar-panel .nav-btn {
      min-width: 3.25rem;
      min-height: 3.5rem;
      justify-content: center;
      padding: 0.5rem !important;
      font-size: 0 !important;
      border-inline-start-width: 0 !important;
      border-block-end: 3px solid transparent;
    }

    .erp-sidebar-panel .nav-btn i {
      font-size: 1rem !important;
    }

    .erp-sidebar-panel .nav-btn.bg-primary-50 {
      border-block-end-color: var(--erp-focus);
    }

    .erp-responsive-table,
    .erp-responsive-table tbody,
    .erp-responsive-table tr,
    .erp-responsive-table td {
      display: block;
      width: 100%;
    }

    .erp-responsive-table thead {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .erp-responsive-table tr {
      padding: 0.75rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .erp-responsive-table td {
      display: grid;
      grid-template-columns: minmax(7rem, 40%) minmax(0, 1fr);
      gap: 0.75rem;
      padding: 0.4rem 0 !important;
      text-align: start !important;
      overflow-wrap: anywhere;
    }

    .erp-responsive-table td.hidden,
    .erp-responsive-table th.hidden,
    .erp-responsive-table .hidden {
      display: none !important;
    }

    .erp-responsive-table td,
    .erp-responsive-table td::before {
      font-size: 0.9375rem;
    }

    .cart-qty-input,
    .cart-custom-name,
    .cart-custom-price,
    .cart-custom-cost,
    .tier-min,
    .tier-max,
    .tier-price {
      font-size: 0.9375rem !important;
    }

    .erp-responsive-table td::before {
      content: attr(data-label);
      font-weight: 700;
      color: var(--erp-ink-muted);
    }

    .erp-responsive-table td:empty {
      display: none;
    }

    #order-modal,
    #product-modal,
    #rate-modal {
      padding: 0 !important;
      align-items: flex-end !important;
    }

    #order-modal>div,
    #product-modal>div,
    #rate-modal>div {
      width: 100%;
      max-width: none;
      max-height: min(94dvh, 48rem);
      border-radius: 1rem 1rem 0 0;
    }

    #order-modal>div {
      max-height: 100dvh;
      border-radius: 0;
    }

    #order-modal .overflow-x-auto {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #toast {
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      max-width: calc(100vw - 2rem);
    }
  }

  @media (max-width: 480px) {
    header>div {
      align-items: stretch !important;
    }

    header>div>div:first-child {
      flex: 1 1 100%;
      min-width: 0;
    }

    header>div>div:nth-child(2) {
      flex: 1 1 100%;
      min-width: 0;
      justify-content: space-between;
      gap: 0.5rem !important;
    }

    header>div>div:nth-child(2)>div:first-child {
      min-width: 0;
      flex: 1 1 auto;
    }

    header>div>div:nth-child(2)>div:first-child span {
      white-space: nowrap;
    }

    header>div>div:nth-child(2)>div:last-child {
      padding-inline-start: 0.5rem;
    }

    .erp-sidebar-panel nav {
      grid-template-columns: repeat(5, minmax(2.75rem, 1fr));
      gap: 0 !important;
    }

    .erp-sidebar-panel .nav-btn {
      min-width: 2.75rem;
    }

    .erp-responsive-table td {
      grid-template-columns: minmax(5.5rem, 34%) minmax(0, 1fr);
      gap: 0.5rem;
    }

    #order-modal>div,
    #product-modal>div,
    #rate-modal>div {
      max-height: 98dvh;
    }
  }

  @media (max-height: 500px) and (orientation: landscape) {

    #order-modal,
    #product-modal,
    #rate-modal {
      align-items: flex-start !important;
      overflow-y: auto;
    }

    #order-modal>div,
    #product-modal>div,
    #rate-modal>div {
      max-height: none;
      margin-block: 0.5rem;
    }
  }
</style>
