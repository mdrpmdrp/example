<!-- Shared ERP presentation layer. Global tokens belong here as the UI is migrated from index.html. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap');

  :root {
    --erp-surface: oklch(99.2% 0.004 250);
    --erp-surface-muted: oklch(97.3% 0.008 250);
    --erp-surface-raised: oklch(94.7% 0.012 250);
    --erp-ink: oklch(22.5% 0.03 250);
    --erp-ink-muted: oklch(35.5% 0.02 250);
    --erp-ink-subtle: oklch(47.5% 0.015 250);
    --erp-border: oklch(90.7% 0.01 250);
    --erp-border-strong: oklch(83.5% 0.015 250);
    --erp-focus: oklch(58% 0.16 248);
    --erp-primary: oklch(58% 0.16 248);
    --erp-primary-strong: oklch(49% 0.18 248);
    --erp-danger: oklch(62% 0.22 20);
    --erp-success: oklch(57% 0.14 150);
    --erp-warning: oklch(78% 0.13 86);
    --erp-radius-control: 0.5rem;
    --erp-radius-panel: 0.75rem;
    --erp-shadow-panel: 0 8px 14px rgb(15 23 42 / 0.06);
    --erp-font-sans: 'Noto Sans Thai', sans-serif;
    --erp-font-heading: 'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif;
    --erp-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --erp-motion-fast: 150ms ease-out;
  }

  html {
    overflow-x: hidden;
    background: var(--erp-surface-muted);
    font-size: 16px;
  }

  body {
    min-width: 0;
    font-family: var(--erp-font-sans);
    color: var(--erp-ink);
    background:
      radial-gradient(circle at top, oklch(70% 0.12 248 / 0.13), transparent 34%),
      linear-gradient(180deg, var(--erp-surface) 0%, var(--erp-surface-muted) 42%, oklch(92.2% 0.016 250) 100%);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }

  .font-mono,
  td.text-right,
  .cart-total-price,
  .bill-total-val,
  .grand-price {
    font-variant-numeric: tabular-nums;
  }

  .erp-panel {
    background: color-mix(in oklab, var(--erp-surface) 96%, transparent);
    border: 1px solid var(--erp-border);
    border-radius: var(--erp-radius-panel);
    box-shadow: var(--erp-shadow-panel);
  }

  .erp-surface-card {
    background: color-mix(in oklab, var(--erp-surface) 96%, transparent);
    border: 1px solid var(--erp-border);
    border-radius: var(--erp-radius-panel);
    box-shadow: var(--erp-shadow-panel);
  }

  .erp-toolbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    background: rgba(248, 250, 252, 0.92);
    border: 1px solid var(--erp-border);
    border-radius: var(--erp-radius-control);
    padding: 0.625rem;
  }

  .erp-control {
    min-height: 2.75rem;
    border: 1px solid var(--erp-border-strong);
    border-radius: var(--erp-radius-control);
    color: var(--erp-ink);
    background: var(--erp-surface);
    transition: border-color var(--erp-motion-fast), box-shadow var(--erp-motion-fast);
  }

  .erp-control:focus {
    border-color: var(--erp-focus);
    box-shadow: 0 0 0 3px rgb(2 132 199 / 0.16);
    outline: 0;
  }

  .erp-action {
    min-height: 2.75rem;
    border-radius: var(--erp-radius-control);
    font-weight: 700;
    transition: background-color var(--erp-motion-fast), color var(--erp-motion-fast), border-color var(--erp-motion-fast), transform var(--erp-motion-fast);
  }

  .erp-action-primary {
    color: #ffffff !important;
    background: var(--erp-primary);
  }

  .erp-action-primary:hover {
    background: var(--erp-primary-strong);
  }

  .erp-action-danger {
    color: #9f1239 !important;
    background: #fff1f2;
    border: 1px solid #fecdd3;
  }

  .erp-action-danger:hover {
    background: #ffe4e6;
  }

  .erp-action-secondary {
    color: #334155 !important;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    font-weight: 700 !important;
  }

  .erp-action-secondary:hover {
    color: #0f172a !important;
    background: #e2e8f0;
    border-color: #94a3b8;
  }

  .erp-stat-primary {
    color: #ffffff;
    background:
      radial-gradient(circle at top right, rgb(255 255 255 / 0.12), transparent 36%),
      linear-gradient(180deg, oklch(63% 0.16 248), oklch(52% 0.16 248));
    border: 1px solid oklch(49% 0.16 248);
    box-shadow: 0 10px 18px rgb(2 8 23 / 0.10);
  }

  .erp-stat-primary :is(.text-slate-400, .text-slate-500, .text-slate-600, .text-slate-700, .text-slate-800),
  .erp-stat-primary :is(i) {
    color: color-mix(in oklab, white 84%, var(--erp-primary));
  }

  .erp-stat-warning {
    color: var(--erp-ink);
    background:
      radial-gradient(circle at top right, rgb(255 255 255 / 0.6), transparent 42%),
      linear-gradient(180deg, oklch(96.6% 0.03 86), oklch(92.8% 0.05 86));
    border: 1px solid oklch(87.2% 0.08 86);
    box-shadow: 0 8px 14px rgb(15 23 42 / 0.05);
  }

  .erp-stat-warning :is(i) {
    color: oklch(62% 0.16 70);
  }

  .erp-surface-warning {
    background:
      radial-gradient(circle at top right, rgb(255 255 255 / 0.5), transparent 46%),
      linear-gradient(180deg, oklch(97.3% 0.03 86), oklch(94.8% 0.04 86));
    border: 1px solid oklch(89.5% 0.07 86);
    box-shadow: 0 8px 14px rgb(15 23 42 / 0.05);
  }

  .erp-surface-warning .text-slate-600,
  .erp-surface-warning .text-slate-500,
  .erp-surface-warning .text-slate-400 {
    color: var(--erp-ink-muted) !important;
  }

  .erp-surface-success {
    background:
      radial-gradient(circle at top right, rgb(255 255 255 / 0.5), transparent 46%),
      linear-gradient(180deg, oklch(96.7% 0.02 150), oklch(93.8% 0.04 150));
    border: 1px solid oklch(88.8% 0.07 150);
    box-shadow: 0 8px 14px rgb(15 23 42 / 0.05);
  }

  .erp-surface-danger {
    background:
      radial-gradient(circle at top right, rgb(255 255 255 / 0.5), transparent 46%),
      linear-gradient(180deg, oklch(97.2% 0.03 20), oklch(94.6% 0.04 20));
    border: 1px solid oklch(89.2% 0.08 20);
    box-shadow: 0 8px 14px rgb(15 23 42 / 0.05);
  }

  .erp-warning-label {
    color: oklch(50% 0.13 70);
  }

  .erp-warning-icon {
    color: oklch(58% 0.14 70);
  }

  .erp-success-label {
    color: oklch(45% 0.13 150);
  }

  .erp-success-icon {
    color: oklch(52% 0.15 150);
  }

  .erp-icon-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.75rem;
    min-height: 2.75rem;
    border-radius: var(--erp-radius-control);
  }

  .erp-modal-header {
    --erp-modal-header-accent: var(--erp-primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem;
    color: #ffffff;
    background: linear-gradient(180deg, var(--erp-primary), var(--erp-primary-strong));
    box-shadow: inset 0 -2px 0 color-mix(in oklab, var(--erp-modal-header-accent) 68%, white 32%);
  }

  .erp-modal-header--sticky {
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid rgb(255 255 255 / 0.08);
  }

  .erp-modal-header__group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
  }

  .erp-modal-header__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    border-radius: 0.5rem;
    background: color-mix(in oklab, var(--erp-modal-header-accent) 18%, white 82%);
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--erp-modal-header-accent) 28%, white 72%);
    flex: 0 0 auto;
  }

  .erp-modal-header--brand {
    --erp-modal-header-accent: var(--erp-primary);
  }

  .erp-modal-header--info {
    --erp-modal-header-accent: oklch(62% 0.12 220);
  }

  .erp-modal-header--success {
    --erp-modal-header-accent: var(--erp-success);
  }

  .erp-modal-header--warning {
    --erp-modal-header-accent: var(--erp-warning);
  }

  .erp-modal-header--danger {
    --erp-modal-header-accent: var(--erp-danger);
  }

  .erp-modal-header__icon--brand {
    color: color-mix(in oklab, var(--erp-modal-header-accent) 72%, var(--erp-primary-strong));
  }

  .erp-modal-header__icon--info {
    color: color-mix(in oklab, var(--erp-modal-header-accent) 72%, var(--erp-primary-strong));
  }

  .erp-modal-header__icon--success {
    color: color-mix(in oklab, var(--erp-modal-header-accent) 72%, var(--erp-primary-strong));
  }

  .erp-modal-header__icon--warning {
    color: color-mix(in oklab, var(--erp-modal-header-accent) 72%, var(--erp-primary-strong));
  }

  .erp-modal-header__icon--danger {
    color: color-mix(in oklab, var(--erp-modal-header-accent) 72%, var(--erp-primary-strong));
  }

  .erp-main-content .tracking-wider {
    letter-spacing: 0.025em;
  }

  .erp-main-content .font-bold {
    font-weight: 600;
  }

  .erp-main-content .font-extrabold {
    font-weight: 600;
  }

  .erp-main-content .font-black {
    font-weight: 700;
  }

  .erp-main-content .text-slate-400 {
    color: var(--erp-ink-subtle) !important;
  }

  .erp-main-content :is(h1, h2, h3, h4) {
    font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif;
    color: var(--erp-ink);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.1;
    text-wrap: balance;
    font-kerning: normal;
  }

  .erp-main-content h1 {
    font-size: clamp(1.5rem, 1.1rem + 0.9vw, 2rem);
  }

  .erp-main-content h2 {
    font-size: clamp(1.125rem, 0.98rem + 0.35vw, 1.375rem);
  }

  .erp-main-content h3 {
    font-size: clamp(1rem, 0.95rem + 0.16vw, 1.1rem);
  }

  .erp-main-content h4 {
    font-size: 0.95rem;
    font-weight: 600;
  }

  .erp-action:disabled,
  .erp-control:disabled {
    cursor: wait;
    opacity: 0.62;
  }

  .erp-action:active:not(:disabled) {
    transform: translateY(1px);
  }

  .nav-btn {
    min-height: 2.75rem;
    transition: background-color var(--erp-motion-fast), color var(--erp-motion-fast), border-color var(--erp-motion-fast);
  }

  .erp-main-content :is(input:not([type="hidden"]), select) {
    height: 2.5rem;
    min-height: 2.5rem;
    border-color: var(--erp-border-strong);
    color: var(--erp-ink);
  }

  .erp-main-content textarea {
    width: 100%;
    min-height: 5.5rem;
    border-color: var(--erp-border-strong);
    color: var(--erp-ink);
  }

  input:not([type="hidden"]),
  select {
    height: 2.5rem;
    min-height: 2.5rem;
  }

  textarea {
    width: 100% !important;
  }

  .erp-main-content :is(input:not([type="hidden"]), select, textarea)::placeholder {
    color: var(--erp-ink-subtle);
    opacity: 1;
  }

  .erp-main-content :is(input:not([type="hidden"]), select, textarea):focus {
    border-color: var(--erp-focus);
    box-shadow: 0 0 0 3px rgb(2 132 199 / 0.16);
    outline: 0;
  }

  .erp-main-content table tbody tr {
    transition: background-color var(--erp-motion-fast);
  }

  .erp-main-content table tbody tr:focus-within {
    background: #f0f9ff;
  }

  .erp-main-content table :is(th, td) {
    font-size: 0.9375rem !important;
  }

  .erp-main-content table :is(button, .text-xs, .text-\[10px\]) {
    font-size: 0.9375rem !important;
  }

  [role="dialog"] :is(label, .text-xs, .text-\[10px\]):not(button, button *) {
    font-size: 0.75rem !important;
    color: #475569 !important;
    font-weight: 700 !important;
  }

  [role="dialog"] :is(input:not([type="hidden"]), select, textarea) {
    font-size: 0.8125rem !important;
    color: #0f172a !important;
  }

  [role="dialog"] .cart-type-select,
  [role="dialog"] .cart-prod-select,
  [role="dialog"] .cart-unit-select,
  [role="dialog"] .cart-qty-input,
  [role="dialog"] .cart-custom-name,
  [role="dialog"] .cart-custom-price,
  [role="dialog"] .cart-custom-cost,
  [role="dialog"] .tier-min,
  [role="dialog"] .tier-max,
  [role="dialog"] .tier-price {
    font-size: 0.75rem !important;
  }

  .erp-main-content .owner-only-metric.hidden {
    display: none !important;
  }

  .erp-data-cell {
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .erp-table-region {
    contain: content;
  }

  .splash-mark {
    animation: splash-bob 1.8s ease-in-out infinite;
  }

  .splash-track {
    position: relative;
    overflow: hidden;
    background: #e2e8f0;
  }

  .splash-track::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.78), transparent);
    animation: splash-shimmer 1.35s ease-in-out infinite;
  }

  @keyframes splash-shimmer {
    to {
      transform: translateX(100%);
    }
  }

  @keyframes splash-bob {

    0%,
    100% {
      transform: translateY(0) scale(1);
    }

    50% {
      transform: translateY(-3px) scale(1.02);
    }
  }

  .erp-skeleton {
    position: relative;
    overflow: hidden;
    background: #e2e8f0;
    color: transparent !important;
    border-color: transparent !important;
    box-shadow: none !important;
    pointer-events: none;
    user-select: none;
  }

  .erp-skeleton::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.8), transparent);
    animation: splash-shimmer 1.2s ease-in-out infinite;
  }

  .erp-skeleton-circle {
    border-radius: 9999px;
  }

  .erp-skeleton-line {
    border-radius: 9999px;
    min-height: 0.75rem;
  }

  .erp-skeleton-block {
    border-radius: 0.5rem;
    min-height: 1rem;
  }

  :focus-visible {
    outline: 2.5px solid var(--erp-focus);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px rgb(2 132 199 / 0.2);
  }

  @media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }

    .erp-skeleton::after {
      animation: none;
      opacity: 0.4;
    }
  }

  @media (pointer: coarse) {

    button,
    select,
    input:not([type="hidden"]) {
      min-height: 44px;
    }

    button {
      touch-action: manipulation;
    }
  }

  @media (max-width: 767px) {
    body {
      padding-inline: env(safe-area-inset-left) env(safe-area-inset-right);
    }

    header>div,
    .erp-main-shell {
      padding-inline: 0.75rem !important;
    }

    .erp-main-shell {
      padding-block: 0.75rem !important;
      gap: 0.75rem !important;
    }

    .erp-main-content {
      padding: 0.875rem !important;
      border-radius: 0.75rem !important;
    }

    .erp-sidebar-panel {
      position: static !important;
      padding: 0.5rem !important;
    }

    .erp-sidebar-panel>div:first-child,
    .erp-sidebar-panel>div:last-child {
      display: none;
    }

    .erp-sidebar-panel nav {
      display: flex !important;
      flex-wrap: nowrap !important;
      align-items: stretch;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.4rem !important;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in oklab, var(--erp-primary) 75%, white) transparent;
      scroll-snap-type: x proximity;
    }

    .erp-sidebar-panel nav::-webkit-scrollbar {
      height: 0.45rem;
    }

    .erp-sidebar-panel nav::-webkit-scrollbar-track {
      background: transparent;
    }

    .erp-sidebar-panel nav::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, color-mix(in oklab, var(--erp-primary) 82%, white), color-mix(in oklab, var(--erp-primary-strong) 92%, black));
      border-radius: 999px;
      border: 1px solid color-mix(in oklab, var(--erp-surface) 72%, var(--erp-primary));
    }

    .erp-sidebar-panel .nav-btn {
      width: auto !important;
      flex: 0 0 auto;
      min-width: max-content;
      min-height: 3.5rem;
      justify-content: flex-start;
      padding: 0.7rem 0.9rem !important;
      font-size: 0.875rem !important;
      border-inline-start-width: 0 !important;
      border-block-end: 3px solid transparent;
      border-radius: 9999px !important;
      border: 1px solid var(--erp-border) !important;
      background: var(--erp-surface) !important;
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
      scroll-snap-align: start;
    }

    .erp-sidebar-panel .nav-btn i {
      font-size: 1rem !important;
    }

    .erp-sidebar-panel .nav-btn.bg-primary-50 {
      border-block-end-color: var(--erp-focus);
      border-color: color-mix(in oklab, var(--erp-primary) 28%, var(--erp-border)) !important;
      color: var(--erp-primary-strong) !important;
      background: linear-gradient(180deg, color-mix(in oklab, var(--erp-primary) 10%, white), color-mix(in oklab, var(--erp-primary) 4%, var(--erp-surface))) !important;
      box-shadow: 0 4px 10px rgb(2 132 199 / 0.10);
      transform: translateY(-1px);
    }

    .erp-toolbar {
      align-items: stretch;
    }

    .erp-toolbar > label {
      flex: 0 0 100%;
      margin-top: 0.1rem;
    }

    .erp-toolbar > select,
    .erp-toolbar > input {
      flex: 1 1 100%;
      width: 100%;
      min-width: 0;
    }

    .erp-toolbar > span {
      display: none;
    }

    .erp-responsive-table,
    .erp-responsive-table tbody,
    .erp-responsive-table tr,
    .erp-responsive-table td {
      display: block;
      width: 100%;
    }

    .erp-responsive-table thead {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .erp-responsive-table tr {
      padding: 0.75rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .erp-responsive-table td {
      display: grid;
      grid-template-columns: minmax(7rem, 40%) minmax(0, 1fr);
      gap: 0.75rem;
      padding: 0.4rem 0 !important;
      text-align: start !important;
      overflow-wrap: anywhere;
    }

    .erp-responsive-table td.hidden,
    .erp-responsive-table th.hidden,
    .erp-responsive-table .hidden {
      display: none !important;
    }

    .erp-responsive-table td,
    .erp-responsive-table td::before {
      font-size: 0.9375rem;
    }

    .cart-qty-input,
    .cart-custom-name,
    .cart-custom-price,
    .cart-custom-cost,
    .tier-min,
    .tier-max,
    .tier-price {
      font-size: 0.9375rem !important;
    }

    .erp-responsive-table td::before {
      content: attr(data-label);
      font-weight: 700;
      color: var(--erp-ink-muted);
    }

    .erp-responsive-table td[colspan] {
      display: block;
      text-align: center !important;
      padding-inline: 0 !important;
    }

    .erp-responsive-table td[colspan]::before {
      content: none;
    }

    .erp-responsive-table td[data-label="จัดการ"] {
      justify-self: start;
    }

    .erp-responsive-table td:empty {
      display: none;
    }

    .erp-responsive-table td[data-label="รายการ"] > div,
    .erp-responsive-table td[data-label="จัดการ"] > div {
      width: 100%;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .erp-responsive-table td[data-label="รายการ"] button {
      min-height: 2.75rem;
      padding-inline: 0.75rem;
      font-size: 0.8125rem !important;
    }

    .erp-responsive-table td[data-label="จัดการ"] button {
      min-height: 2.75rem;
      min-width: 2.75rem;
      padding-inline: 0.875rem;
      font-size: 0.8125rem !important;
    }

    #order-modal,
    #product-modal,
    #rate-modal {
      padding: 0 !important;
      align-items: flex-end !important;
    }

    #order-modal>div,
    #product-modal>div,
    #rate-modal>div {
      width: 100%;
      max-width: none;
      max-height: min(94dvh, 48rem);
      border-radius: 1rem 1rem 0 0;
    }

    #order-modal>div {
      max-height: 100dvh;
      border-radius: 0;
    }

    #order-modal .overflow-x-auto {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #toast {
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      max-width: calc(100vw - 2rem);
    }
  }

  @media (max-width: 480px) {
    header>div {
      align-items: stretch !important;
    }

    header>div>div:first-child {
      flex: 1 1 100%;
      min-width: 0;
    }

    header>div>div:nth-child(2) {
      flex: 1 1 100%;
