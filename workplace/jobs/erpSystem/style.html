<!-- Shared ERP presentation layer. Global tokens belong here as the UI is migrated from index.html. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap');

  :root {
    --erp-surface: oklch(99.4% 0.004 255);
    --erp-surface-muted: oklch(97.8% 0.01 255);
    --erp-surface-raised: oklch(95.4% 0.014 255);
    --erp-ink: oklch(20.5% 0.032 255);
    --erp-ink-muted: oklch(31.2% 0.024 255);
    --erp-ink-subtle: oklch(42.5% 0.018 255);
    --erp-border: oklch(89.8% 0.012 255);
    --erp-border-strong: oklch(83.1% 0.016 255);
    --erp-focus: oklch(72% 0.1 244);
    --erp-primary: oklch(67% 0.13 244);
    --erp-primary-strong: oklch(58% 0.14 244);
    --erp-danger: oklch(62% 0.22 20);
    --erp-success: oklch(57% 0.14 150);
    --erp-warning: oklch(78% 0.13 86);
    --erp-radius-control: 0.5rem;
    --erp-radius-panel: 0.75rem;
    --erp-shadow-panel: 0 8px 14px rgb(15 23 42 / 0.06);
    --erp-font-sans: 'Noto Sans Thai', sans-serif;
    --erp-font-heading: 'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif;
    --erp-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --erp-motion-fast: 150ms ease-out;
  }

  html {
    overflow-x: hidden;
    background: var(--erp-surface-muted);
    font-size: 16px;
  }

  body {
    min-width: 0;
    font-family: var(--erp-font-sans);
    color: var(--erp-ink);
    background:
      radial-gradient(circle at top left, oklch(81% 0.06 244 / 0.08), transparent 28%),
      linear-gradient(180deg, var(--erp-surface) 0%, var(--erp-surface-muted) 64%, oklch(97% 0.005 255) 100%);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }

  .font-mono,
  td.text-right,
  .cart-total-price,
  .bill-total-val,
  .grand-price {
    font-variant-numeric: tabular-nums;
  }

  .erp-panel {
    background: color-mix(in oklab, var(--erp-surface) 99%, var(--erp-primary) 1%);
    border: 1px solid color-mix(in oklab, var(--erp-border) 96%, var(--erp-primary) 4%);
    border-radius: var(--erp-radius-panel);
    box-shadow: 0 1px 2px rgb(15 23 42 / 0.04), 0 8px 16px rgb(15 23 42 / 0.03);
  }

  .erp-surface-card {
    background: color-mix(in oklab, var(--erp-surface) 99%, var(--erp-primary) 1%);
    border: 1px solid color-mix(in oklab, var(--erp-border) 96%, var(--erp-primary) 4%);
    border-radius: var(--erp-radius-panel);
    box-shadow: 0 1px 2px rgb(15 23 42 / 0.04), 0 8px 16px rgb(15 23 42 / 0.03);
  }

  .erp-toolbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    background: color-mix(in oklab, var(--erp-surface-muted) 95%, var(--erp-primary) 5%);
    border: 1px solid color-mix(in oklab, var(--erp-border) 94%, var(--erp-primary) 6%);
    border-radius: var(--erp-radius-control);
    padding: 0.625rem;
  }

  #app-header {
    background: color-mix(in oklab, var(--erp-surface) 96%, var(--erp-primary) 4%) !important;
    border-bottom: 1px solid color-mix(in oklab, var(--erp-border) 94%, var(--erp-primary) 6%) !important;
  }

  .erp-sidebar-panel {
    background: color-mix(in oklab, var(--erp-surface) 98%, var(--erp-primary) 2%) !important;
    border-color: color-mix(in oklab, var(--erp-border) 94%, var(--erp-primary) 6%) !important;
  }

  .erp-sidebar-panel .bg-slate-50 {
    background: color-mix(in oklab, var(--erp-surface-muted) 96%, var(--erp-primary) 4%) !important;
  }

  .erp-control {
    min-height: 2.75rem;
    border: 1px solid var(--erp-border-strong);
    border-radius: var(--erp-radius-control);
    color: var(--erp-ink);
    background: var(--erp-surface);
    transition: border-color var(--erp-motion-fast), box-shadow var(--erp-motion-fast);
  }

  .erp-control:focus {
    border-color: var(--erp-focus);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--erp-primary) 14%, white 86%);
    outline: 0;
  }

  .erp-action {
    min-height: 2.75rem;
    border-radius: var(--erp-radius-control);
    font-weight: 700;
    transition: background-color var(--erp-motion-fast), color var(--erp-motion-fast), border-color var(--erp-motion-fast);
  }

  .erp-action-primary {
    color: #ffffff !important;
    background: var(--erp-primary);
  }

  .erp-action-primary:hover {
    background: var(--erp-primary-strong);
  }

  .erp-action-danger {
    color: oklch(42% 0.16 18) !important;
    background: oklch(97.2% 0.025 18);
    border: 1px solid oklch(90% 0.05 18);
  }

  .erp-action-danger:hover {
    background: oklch(95.8% 0.035 18);
  }

  .erp-action-secondary {
    color: var(--erp-ink-muted) !important;
    background: color-mix(in oklab, var(--erp-surface-muted) 94%, var(--erp-primary) 6%);
    border: 1px solid color-mix(in oklab, var(--erp-border) 94%, var(--erp-primary) 6%);
    font-weight: 700 !important;
  }

  .erp-action-secondary:hover {
    color: var(--erp-ink) !important;
    background: color-mix(in oklab, var(--erp-surface-muted) 86%, var(--erp-primary) 14%);
    border-color: color-mix(in oklab, var(--erp-border-strong) 90%, var(--erp-primary) 10%);
  }

  .erp-stat-primary {
    color: #ffffff;
    background:
      radial-gradient(circle at top right, rgb(255 255 255 / 0.08), transparent 40%),
      radial-gradient(circle at bottom right, oklch(84% 0.08 344 / 0.14), transparent 36%),
      linear-gradient(180deg, oklch(70% 0.11 244), oklch(62% 0.12 244));
    border: 1px solid oklch(60% 0.11 244);
    box-shadow: 0 4px 10px rgb(2 8 23 / 0.08);
  }

  .erp-stat-primary :is(.text-slate-400, .text-slate-500, .text-slate-600, .text-slate-700, .text-slate-800),
  .erp-stat-primary :is(i) {
    color: color-mix(in oklab, white 84%, var(--erp-primary));
  }

  .erp-stat-warning {
    color: var(--erp-ink);
    background:
      radial-gradient(circle at top right, rgb(255 255 255 / 0.45), transparent 46%),
      linear-gradient(180deg, oklch(97% 0.02 92), oklch(94.6% 0.035 92));
    border: 1px solid oklch(89.5% 0.045 92);
    box-shadow: 0 4px 10px rgb(15 23 42 / 0.04);
  }

  .erp-stat-warning :is(i) {
    color: oklch(62% 0.16 90);
  }

  .erp-surface-warning {
    background:
      radial-gradient(circle at top right, rgb(255 255 255 / 0.35), transparent 50%),
      linear-gradient(180deg, oklch(97.4% 0.02 92), oklch(95.4% 0.03 92));
    border: 1px solid oklch(90.5% 0.045 92);
    box-shadow: 0 4px 10px rgb(15 23 42 / 0.04);
  }

  .erp-surface-warning .text-slate-600,
  .erp-surface-warning .text-slate-500,
  .erp-surface-warning .text-slate-400 {
    color: var(--erp-ink-muted) !important;
  }

  .erp-surface-success {
    background:
      radial-gradient(circle at top right, rgb(255 255 255 / 0.35), transparent 50%),
      linear-gradient(180deg, oklch(97% 0.015 150), oklch(95% 0.025 150));
    border: 1px solid oklch(90% 0.04 150);
    box-shadow: 0 4px 10px rgb(15 23 42 / 0.04);
  }

  .erp-surface-danger {
    background:
      radial-gradient(circle at top right, rgb(255 255 255 / 0.35), transparent 50%),
      linear-gradient(180deg, oklch(97.4% 0.02 20), oklch(95.2% 0.03 20));
    border: 1px solid oklch(90.5% 0.045 20);
    box-shadow: 0 4px 10px rgb(15 23 42 / 0.04);
  }

  .erp-empty-state {
    background: color-mix(in oklab, var(--erp-surface) 92%, var(--erp-primary) 8%);
    border: 1px solid color-mix(in oklab, var(--erp-border) 88%, var(--erp-primary) 12%);
    color: var(--erp-ink-muted);
  }

  .erp-empty-state--info {
    background: color-mix(in oklab, var(--erp-surface) 90%, var(--erp-primary) 10%);
    border-color: color-mix(in oklab, var(--erp-border) 86%, var(--erp-primary) 14%);
  }

  .erp-empty-state--success {
    background: color-mix(in oklab, var(--erp-surface) 88%, var(--erp-success) 12%);
    border-color: color-mix(in oklab, var(--erp-border) 84%, var(--erp-success) 16%);
  }

  .erp-empty-state--warning {
    background: color-mix(in oklab, var(--erp-surface) 88%, var(--erp-warning) 12%);
    border-color: color-mix(in oklab, var(--erp-border) 84%, var(--erp-warning) 16%);
  }

  .erp-empty-state--danger {
    background: color-mix(in oklab, var(--erp-surface) 88%, var(--erp-danger) 12%);
    border-color: color-mix(in oklab, var(--erp-border) 84%, var(--erp-danger) 16%);
  }

  .erp-warning-label {
    color: oklch(45% 0.14 90);
  }

  .erp-warning-icon {
    color: oklch(54% 0.14 90);
  }

  .erp-success-label {
    color: oklch(45% 0.13 150);
  }

  .erp-success-icon {
    color: oklch(52% 0.15 150);
  }

  .erp-icon-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.75rem;
    min-height: 2.75rem;
    border-radius: var(--erp-radius-control);
  }

  .erp-modal-header {
    --erp-modal-header-accent: var(--erp-primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem;
    color: #ffffff;
    background: linear-gradient(180deg, color-mix(in oklab, var(--erp-modal-header-accent) 84%, white 16%), var(--erp-modal-header-accent));
    box-shadow: inset 0 -1px 0 color-mix(in oklab, var(--erp-modal-header-accent) 72%, white 28%);
  }

  .erp-modal-header--sticky {
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid rgb(255 255 255 / 0.08);
  }

  .erp-modal-header__group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
  }

  .erp-modal-header__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    border-radius: 0.5rem;
    background: color-mix(in oklab, var(--erp-modal-header-accent) 12%, white 88%);
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--erp-modal-header-accent) 22%, white 78%);
    flex: 0 0 auto;
  }

  .erp-modal-header--brand {
    --erp-modal-header-accent: var(--erp-primary);
  }

  .erp-modal-header--info {
    --erp-modal-header-accent: oklch(62% 0.12 220);
  }

  .erp-modal-header--success {
    --erp-modal-header-accent: var(--erp-success);
  }

  .erp-modal-header--warning {
    --erp-modal-header-accent: var(--erp-warning);
  }

  .erp-modal-header--danger {
    --erp-modal-header-accent: var(--erp-danger);
  }

  .erp-modal-header__icon--brand {
    color: color-mix(in oklab, var(--erp-modal-header-accent) 72%, var(--erp-primary-strong));
  }

  .erp-modal-header__icon--info {
    color: color-mix(in oklab, var(--erp-modal-header-accent) 72%, var(--erp-primary-strong));
  }

  .erp-modal-header__icon--success {
    color: color-mix(in oklab, var(--erp-modal-header-accent) 72%, var(--erp-primary-strong));
  }

  .erp-modal-header__icon--warning {
    color: color-mix(in oklab, var(--erp-modal-header-accent) 72%, var(--erp-primary-strong));
  }

  .erp-modal-header__icon--danger {
    color: color-mix(in oklab, var(--erp-modal-header-accent) 72%, var(--erp-primary-strong));
  }

  .erp-main-content .tracking-wider {
    letter-spacing: 0.015em;
  }

  #app-header .uppercase,
  .erp-sidebar-panel .uppercase,
  .erp-main-content .uppercase,
  .erp-modal-header .uppercase,
  #app-footer .uppercase {
    text-transform: none !important;
    letter-spacing: 0.01em !important;
  }

  .erp-main-content .font-bold {
    font-weight: 600;
  }

  .erp-main-content .font-extrabold {
    font-weight: 600;
  }

  .erp-main-content .font-black {
    font-weight: 700;
  }

  .erp-main-content .text-slate-400 {
    color: var(--erp-ink-subtle) !important;
  }

  #app-header .text-slate-400,
  #app-header .text-slate-500,
  .erp-sidebar-panel .text-slate-400,
  .erp-sidebar-panel .text-slate-500,
  .erp-toolbar .text-slate-400,
  .erp-toolbar .text-slate-500 {
    color: var(--erp-ink-muted) !important;
  }

  .erp-main-content :is(h1, h2, h3, h4) {
    font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif;
    color: var(--erp-ink);
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.1;
    text-wrap: balance;
    font-kerning: normal;
  }

  .erp-main-content h1 {
    font-size: clamp(1.5rem, 1.1rem + 0.9vw, 2rem);
  }

  .erp-main-content h2 {
    font-size: clamp(1.125rem, 0.98rem + 0.35vw, 1.375rem);
  }

  .erp-main-content h3 {
    font-size: clamp(1rem, 0.95rem + 0.16vw, 1.1rem);
  }

  .erp-main-content h4 {
    font-size: 0.95rem;
    font-weight: 600;
  }

  .erp-action:disabled,
  .erp-control:disabled {
    cursor: wait;
    opacity: 0.62;
  }

  .erp-action:active:not(:disabled) {
    transform: translateY(1px);
  }

  .nav-btn {
    min-height: 2.75rem;
    transition: background-color var(--erp-motion-fast), color var(--erp-motion-fast), border-color var(--erp-motion-fast);
  }

  .erp-main-content :is(input:not([type="hidden"]), select) {
    height: 2.5rem;
    min-height: 2.5rem;
    border-color: var(--erp-border-strong);
    color: var(--erp-ink);
  }

  .erp-main-content textarea {
    width: 100%;
    min-height: 5.5rem;
    border-color: var(--erp-border-strong);
    color: var(--erp-ink);
  }

  input:not([type="hidden"]),
  select {
    height: 2.5rem;
    min-height: 2.5rem;
  }

  textarea {
    width: 100% !important;
  }

  .erp-main-content :is(input:not([type="hidden"]), select, textarea)::placeholder {
    color: var(--erp-ink-subtle);
    opacity: 1;
  }

  .erp-main-content :is(input:not([type="hidden"]), select, textarea):focus {
    border-color: var(--erp-focus);
    box-shadow: 0 0 0 3px rgb(2 132 199 / 0.16);
    outline: 0;
  }

  .erp-main-content table tbody tr {
    transition: background-color var(--erp-motion-fast);
  }

  .erp-main-content table tbody tr:focus-within {
    background: color-mix(in oklab, var(--erp-primary) 6%, var(--erp-surface) 94%);
  }

  .erp-main-content table thead tr {
    background: color-mix(in oklab, var(--erp-surface-muted) 85%, var(--erp-primary) 15%) !important;
  }

  .erp-main-content table thead th {
    color: var(--erp-ink-muted) !important;
    border-bottom-color: color-mix(in oklab, var(--erp-border-strong) 90%, var(--erp-primary) 10%) !important;
  }

  .erp-main-content table :is(.bg-slate-50, .bg-slate-50\/40, .bg-slate-50\/50, .bg-slate-50\/60, .bg-slate-50\/70) {
    background: color-mix(in oklab, var(--erp-surface) 96%, var(--erp-primary) 4%) !important;
  }

  .erp-main-content table :is(.bg-slate-100, .hover\:bg-slate-100:hover) {
    background: color-mix(in oklab, var(--erp-surface-muted) 88%, var(--erp-primary) 12%) !important;
  }

  .erp-main-content table :is(.bg-slate-200, .hover\:bg-slate-200:hover) {
    background: color-mix(in oklab, var(--erp-surface-muted) 82%, var(--erp-primary) 18%) !important;
  }

  .erp-main-content table :is(.bg-slate-300, .hover\:bg-slate-300:hover) {
    background: color-mix(in oklab, var(--erp-surface-muted) 76%, var(--erp-primary) 24%) !important;
  }

  .erp-main-content table tbody tr:hover {
    background: color-mix(in oklab, var(--erp-primary) 4%, var(--erp-surface) 96%);
  }

  .erp-main-content table :is(th, td) {
    font-size: 0.9375rem !important;
  }

  .erp-main-content table :is(button, .text-xs, .text-\[10px\]) {
    font-size: 0.9375rem !important;
  }

  [role="dialog"] :is(label, .text-xs, .text-\[10px\]):not(button, button *) {
    font-size: 0.75rem !important;
    color: #475569 !important;
    font-weight: 700 !important;
  }

  [role="dialog"] :is(input:not([type="hidden"]), select, textarea) {
    font-size: 0.8125rem !important;
    color: #0f172a !important;
  }

  [role="dialog"] .cart-type-select,
  [role="dialog"] .cart-prod-select,
  [role="dialog"] .cart-unit-select,
  [role="dialog"] .cart-qty-input,
  [role="dialog"] .cart-custom-name,
  [role="dialog"] .cart-custom-price,
  [role="dialog"] .cart-custom-cost,
  [role="dialog"] .tier-min,
  [role="dialog"] .tier-max,
  [role="dialog"] .tier-price {
    font-size: 0.75rem !important;
  }

  [role="dialog"] .select2-container {
    width: 100% !important;
    max-width: 100% !important;
    font-size: 0.75rem !important;
  }

  [role="dialog"] .select2-dropdown {
    width: min(36rem, calc(100vw - 1rem)) !important;
    min-width: min(36rem, calc(100vw - 1rem)) !important;
    max-width: calc(100vw - 1rem) !important;
    box-sizing: border-box;
  }

  [role="dialog"] .select2-container .select2-selection--single,
  [role="dialog"] .select2-container .select2-search__field,
  [role="dialog"] .select2-container .select2-results__option {
    font-size: 0.75rem !important;
  }

  [role="dialog"] .select2-container .select2-results__option {
    overflow-wrap: anywhere;
  }

  [role="dialog"] .select2-container .cart-prod-option {
    display: grid;
    gap: 0.2rem;
    line-height: 1.25;
  }

  [role="dialog"] .select2-container .cart-prod-option__name {
    color: #0f172a;
    font-size: 0.78rem;
    font-weight: 700;
  }

  [role="dialog"] .select2-container .cart-prod-option__meta {
    color: #475569;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  [role="dialog"] .select2-container .select2-results__option--highlighted .cart-prod-option__meta {
    color: rgb(241 245 249);
  }

  [role="dialog"] .select2-container .select2-results__option--highlighted .cart-prod-option__name {
    color: #ffffff;
  }

  .erp-main-content .owner-only-metric.hidden {
    display: none !important;
  }

  .erp-data-cell {
    min-width: 0;
    overflow-wrap: anywhere;
  }

  #stock-table-body .erp-data-cell {
    font-size: 0.75rem;
    line-height: 1.1rem;
    letter-spacing: -0.005em;
  }

  .erp-table-region {
    contain: content;
  }

  .splash-mark {
    animation: splash-bob 1.8s ease-in-out infinite;
  }

  .splash-track {
    position: relative;
    overflow: hidden;
    background: color-mix(in oklab, var(--erp-surface-muted) 93%, var(--erp-primary) 7%);
  }

  .splash-track::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.5), transparent);
    animation: splash-shimmer 1.35s ease-in-out infinite;
  }

  @keyframes splash-shimmer {
    to {
      transform: translateX(100%);
    }
  }

  @keyframes splash-bob {

    0%,
    100% {
      transform: translateY(0) scale(1);
    }

    50% {
      transform: translateY(-3px) scale(1.02);
    }
  }

  .erp-skeleton {
    position: relative;
    overflow: hidden;
    background: color-mix(in oklab, var(--erp-surface-muted) 93%, var(--erp-primary) 7%);
    color: transparent !important;
    border-color: transparent !important;
    box-shadow: none !important;
    pointer-events: none;
    user-select: none;
  }

  .erp-skeleton::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.5), transparent);
    animation: splash-shimmer 1.2s ease-in-out infinite;
  }

  .erp-skeleton-circle {
    border-radius: 9999px;
  }

  .erp-skeleton-line {
    border-radius: 9999px;
    min-height: 0.75rem;
  }

  .erp-skeleton-block {
    border-radius: 0.5rem;
    min-height: 1rem;
  }

  :focus-visible {
    outline: 2.5px solid var(--erp-focus);
    outline-offset: 2px;
    box-shadow: 0 0 0 4px color-mix(in oklab, var(--erp-primary) 16%, white 84%);
  }

  @media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }

    .erp-skeleton::after {
      animation: none;
      opacity: 0.4;
    }
  }

  @media (pointer: coarse) {

    button,
    select,
    input:not([type="hidden"]) {
      min-height: 44px;
    }

    button {
      touch-action: manipulation;
    }
  }
