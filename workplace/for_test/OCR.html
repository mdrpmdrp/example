<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Segoe UI", "Tahoma", "sans-serif"]
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-cyan-50 via-sky-50 to-slate-100 text-slate-800">
    <div class="mx-auto w-full max-w-7xl p-4 md:p-6">
      <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white/95 shadow-xl shadow-slate-200/60">
        <div class="border-b border-slate-200 bg-gradient-to-r from-cyan-100 via-sky-100 to-blue-100 px-5 py-4 md:px-6">
          <div class="flex items-start gap-3">
            <div class="rounded-xl bg-white p-2 text-cyan-700 shadow-sm">
              <i data-lucide="scan-line" class="h-5 w-5"></i>
            </div>
            <div>
              <h2 class="text-lg font-bold tracking-tight md:text-xl">Royal Thai Police IDPA</h2>
            </div>
          </div>
        </div>

        <div class="grid gap-3 border-b border-slate-200 px-5 py-4 md:grid-cols-[140px,160px] md:justify-end md:px-6">
          <div>
            <label for="batchSize" class="mb-1 block text-xs font-medium text-slate-600">Batch Size</label>
            <input
              id="batchSize"
              type="number"
              min="1"
              max="20"
              value="5"
              class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none ring-cyan-400 transition focus:border-cyan-400 focus:ring"
            />
          </div>
          <div class="flex items-end">
            <button
              id="runBtn"
              type="button"
              class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-teal-600 to-sky-500 px-3 py-2.5 text-sm font-semibold text-white shadow-lg shadow-cyan-700/20 transition hover:brightness-105 disabled:cursor-not-allowed disabled:opacity-60"
            >
              <i data-lucide="play" class="h-4 w-4"></i>
              <span>เริ่มอ่านไฟล์</span>
            </button>
          </div>
        </div>

        <div id="statusText" class="flex items-center gap-2 px-5 py-3 text-sm text-slate-600 md:px-6">
          <i data-lucide="info" class="h-4 w-4"></i>
          <span>พร้อมเริ่มทำงาน</span>
        </div>

        <div class="space-y-4 px-5 pb-5 md:px-6 md:pb-6">
          <div class="overflow-hidden rounded-xl border border-slate-200">
            <div class="flex items-center gap-2 border-b border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-600">
              <i data-lucide="list-todo" class="h-4 w-4"></i>
              <span>สถานะไฟล์</span>
            </div>
            <div class="max-h-64 overflow-auto">
              <table class="w-full border-collapse text-xs md:text-sm">
                <thead class="sticky top-0 z-10 bg-slate-50 text-slate-600">
                  <tr>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">ชื่อไฟล์</th>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">สถานะ</th>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">รายละเอียด</th>
                  </tr>
                </thead>
                <tbody id="statusBody"></tbody>
              </table>
            </div>
          </div>

          <div class="overflow-hidden rounded-xl border border-slate-200">
            <div class="flex items-center gap-2 border-b border-slate-200 bg-slate-50 px-3 py-2 text-xs font-semibold text-slate-600">
              <i data-lucide="table-properties" class="h-4 w-4"></i>
              <span>ผลลัพธ์ที่อ่านได้</span>
            </div>
            <div class="max-h-72 overflow-auto">
              <table class="w-full border-collapse text-xs md:text-sm">
                <thead class="sticky top-0 z-10 bg-slate-50 text-slate-600">
                  <tr>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">ชื่อไฟล์</th>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">Stage</th>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">No.</th>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">Time</th>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">Name</th>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">PD</th>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">HNT</th>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">PE</th>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">FP</th>
                    <th class="border-b border-slate-200 px-3 py-2 text-left font-semibold">FTDR</th>
                  </tr>
                </thead>
                <tbody id="resultBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const fileStateMap = {};
      const resultMap = {};

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function refreshIcons() {
        if (window.lucide && window.lucide.createIcons) {
          window.lucide.createIcons();
        }
      }

      function setStatusText(message, type) {
        const iconByType = {
          info: "info",
          loading: "loader-circle",
          success: "circle-check-big",
          error: "triangle-alert"
        };
        const colorByType = {
          info: "text-slate-600",
          loading: "text-amber-700",
          success: "text-emerald-700",
          error: "text-rose-700"
        };
        const currentType = type || "info";
        const spin = currentType === "loading" ? " animate-spin" : "";

        $("#statusText")
          .removeClass("text-slate-600 text-amber-700 text-emerald-700 text-rose-700")
          .addClass(colorByType[currentType])
          .html(
            "<i data-lucide=\"" + iconByType[currentType] + "\" class=\"h-4 w-4" + spin + "\"></i>" +
              "<span>" + escapeHtml(message) + "</span>"
          );
        refreshIcons();
      }

      function setButtonEnabled(isEnabled) {
        $("#runBtn").prop("disabled", !isEnabled);
      }

      function statusUi(status) {
        if (status === "เสร็จสิ้น") {
          return { badge: "bg-emerald-100 text-emerald-700", icon: "circle-check-big", spin: "" };
        }
        if (status === "ผิดพลาด") {
          return { badge: "bg-rose-100 text-rose-700", icon: "triangle-alert", spin: "" };
        }
        return { badge: "bg-amber-100 text-amber-700", icon: "loader-circle", spin: " animate-spin" };
      }

      function renderStatusTable() {
        const rows = Object.values(fileStateMap)
          .map(function(item) {
            const ui = statusUi(item.status);
            return (
              "<tr class=\"border-b border-slate-100\">" +
              "<td class=\"px-3 py-2\">" + escapeHtml(item.name) + "</td>" +
              "<td class=\"px-3 py-2\"><span class=\"inline-flex items-center gap-1 rounded-full px-2 py-1 text-xs font-medium " +
              ui.badge + "\"><i data-lucide=\"" + ui.icon + "\" class=\"h-3.5 w-3.5" + ui.spin + "\"></i>" + escapeHtml(item.status) + "</span></td>" +
              "<td class=\"px-3 py-2 text-slate-600\">" + escapeHtml(item.message || "") + "</td>" +
              "</tr>"
            );
          })
          .join("");
        $("#statusBody").html(rows);
        refreshIcons();
      }

      function renderResultTable() {
        const rows = Object.values(resultMap)
          .map(function(item) {
            return (
              "<tr class=\"border-b border-slate-100\">" +
              "<td class=\"px-3 py-2\">" + escapeHtml(item.fileName || "") + "</td>" +
              "<td class=\"px-3 py-2\">" + escapeHtml(item.Stage || "") + "</td>" +
              "<td class=\"px-3 py-2\">" + escapeHtml(item.No || "") + "</td>" +
              "<td class=\"px-3 py-2\">" + escapeHtml(item.Time || "") + "</td>" +
              "<td class=\"px-3 py-2\">" + escapeHtml(item.Name || "") + "</td>" +
              "<td class=\"px-3 py-2\">" + escapeHtml(item.PD || "") + "</td>" +
              "<td class=\"px-3 py-2\">" + escapeHtml(item.HNT || "") + "</td>" +
              "<td class=\"px-3 py-2\">" + escapeHtml(item.PE || "") + "</td>" +
              "<td class=\"px-3 py-2\">" + escapeHtml(item.FP || "") + "</td>" +
              "<td class=\"px-3 py-2\">" + escapeHtml(item.FTDR || "") + "</td>" +
              "</tr>"
            );
          })
          .join("");
        $("#resultBody").html(rows);
      }

      function chunkArray(source, size) {
        const chunks = [];
        for (let i = 0; i < source.length; i += size) {
          chunks.push(source.slice(i, i + size));
        }
        return chunks;
      }

      function resetData() {
        Object.keys(fileStateMap).forEach(function(key) {
          delete fileStateMap[key];
        });
        Object.keys(resultMap).forEach(function(key) {
          delete resultMap[key];
        });
        renderStatusTable();
        renderResultTable();
      }

      function startRun() {
        const batchSize = Number($("#batchSize").val()) || 5;

        resetData();
        setButtonEnabled(false);
        setStatusText("กำลังโหลดรายชื่อไฟล์...", "loading");

        google.script.run
          .withSuccessHandler(function(files) {
            if (!files || !files.length) {
              setStatusText("ไม่พบไฟล์ในโฟลเดอร์", "error");
              setButtonEnabled(true);
              return;
            }

            files.forEach(function(file) {
              fileStateMap[file.id] = {
                id: file.id,
                name: file.name,
                status: "กำลังอ่าน",
                message: "กำลังอ่านไฟล์"
              };
            });
            renderStatusTable();

            const batches = chunkArray(files, Math.max(1, Math.min(batchSize, 20)));
            setStatusText("เริ่มประมวลผล " + files.length + " ไฟล์ ด้วย " + batches.length + " batch", "loading");
            runBatchesSequentially(batches, 0);
          })
          .withFailureHandler(function(err) {
            setStatusText("โหลดไฟล์ไม่สำเร็จ: " + (err && err.message ? err.message : String(err)), "error");
            setButtonEnabled(true);
          })
          .listFilesInFolder();
      }

      function runBatchesSequentially(batches, index) {
        if (index >= batches.length) {
          setStatusText("เสร็จสิ้นทั้งหมด", "success");
          setButtonEnabled(true);
          return;
        }

        const currentBatch = batches[index];
        const fileIds = currentBatch.map(function(file) {
          return file.id;
        });

        currentBatch.forEach(function(file) {
          if (fileStateMap[file.id]) {
            fileStateMap[file.id].status = "กำลังอ่าน";
            fileStateMap[file.id].message = "กำลังอ่านไฟล์";
          }
        });
        renderStatusTable();
        setStatusText("กำลังอ่านไฟล์ batch " + (index + 1) + "/" + batches.length, "loading");

        google.script.run
          .withSuccessHandler(function(readResults) {
            const extractedItems = [];

            (readResults || []).forEach(function(item) {
              const id = item.fileId;
              if (!id || !fileStateMap[id]) {
                return;
              }

              if (item.error) {
                fileStateMap[id].status = "ผิดพลาด";
                fileStateMap[id].message = item.error;
                return;
              }

              extractedItems.push(item);
              fileStateMap[id].status = "กำลังอ่าน";
              fileStateMap[id].message = "กำลังเปลี่ยนชื่อ";
              resultMap[id] = {
                fileName: fileStateMap[id].name,
                Stage: item.Stage,
                No: item.No,
                Time: item.Time,
                Name: item.Name,
                PD: item.PD,
                HNT: item.HNT,
                PE: item.PE,
                FP: item.FP,
                FTDR: item.FTDR
              };
            });

            renderStatusTable();
            renderResultTable();

            if (!extractedItems.length) {
              runBatchesSequentially(batches, index + 1);
              return;
            }

            setStatusText("กำลังเปลี่ยนชื่อ batch " + (index + 1) + "/" + batches.length, "loading");

            google.script.run
              .withSuccessHandler(function(renamedItems) {
                const saveTargets = [];

                (renamedItems || []).forEach(function(item) {
                  const id = item.fileId;
                  if (!id || !fileStateMap[id]) {
                    return;
                  }

                  if (item.error) {
                    fileStateMap[id].status = "ผิดพลาด";
                    fileStateMap[id].message = item.error;
                    return;
                  }

                  saveTargets.push(item);
                  if (item.fileName) {
                    fileStateMap[id].name = item.fileName;
                  }
                  fileStateMap[id].status = "กำลังอ่าน";
                  fileStateMap[id].message = "กำลังบันทึกข้อมูล";
                  if (resultMap[id]) {
                    resultMap[id].fileName = fileStateMap[id].name;
                  }
                });

                renderStatusTable();
                renderResultTable();

                if (!saveTargets.length) {
                  runBatchesSequentially(batches, index + 1);
                  return;
                }

                setStatusText("กำลังบันทึกข้อมูล batch " + (index + 1) + "/" + batches.length, "loading");

                google.script.run
                  .withSuccessHandler(function(savedItems) {
                    (savedItems || []).forEach(function(item) {
                      const id = item.fileId;
                      if (!id || !fileStateMap[id]) {
                        return;
                      }

                      if (item.error) {
                        fileStateMap[id].status = "ผิดพลาด";
                        fileStateMap[id].message = item.error;
                        return;
                      }

                      fileStateMap[id].status = "เสร็จสิ้น";
                      fileStateMap[id].message = "ดำเนินการเรียบร้อย";
                      if (item.fileName) {
                        fileStateMap[id].name = item.fileName;
                      }
                      if (resultMap[id]) {
                        resultMap[id].fileName = fileStateMap[id].name;
                      }
                    });

                    renderStatusTable();
                    renderResultTable();
                    runBatchesSequentially(batches, index + 1);
                  })
                  .withFailureHandler(function(err) {
                    const message = err && err.message ? err.message : String(err);
                    saveTargets.forEach(function(item) {
                      if (fileStateMap[item.fileId]) {
                        fileStateMap[item.fileId].status = "ผิดพลาด";
                        fileStateMap[item.fileId].message = "บันทึกข้อมูลล้มเหลว: " + message;
                      }
                    });
                    renderStatusTable();
                    setStatusText("เกิดข้อผิดพลาดระหว่างบันทึกข้อมูล batch " + (index + 1) + ": " + message, "error");
                    setButtonEnabled(true);
                  })
                  .saveResultsBatch(saveTargets);
              })
              .withFailureHandler(function(err) {
                const message = err && err.message ? err.message : String(err);
                extractedItems.forEach(function(item) {
                  if (fileStateMap[item.fileId]) {
                    fileStateMap[item.fileId].status = "ผิดพลาด";
                    fileStateMap[item.fileId].message = "เปลี่ยนชื่อล้มเหลว: " + message;
                  }
                });
                renderStatusTable();
                setStatusText("เกิดข้อผิดพลาดระหว่างเปลี่ยนชื่อ batch " + (index + 1) + ": " + message, "error");
                setButtonEnabled(true);
              })
              .renameAndMoveBatch(extractedItems);
          })
          .withFailureHandler(function(err) {
            const message = err && err.message ? err.message : String(err);
            currentBatch.forEach(function(file) {
              if (fileStateMap[file.id]) {
                fileStateMap[file.id].status = "ผิดพลาด";
                fileStateMap[file.id].message = "อ่านไฟล์ล้มเหลว: " + message;
              }
            });
            renderStatusTable();
            setStatusText("เกิดข้อผิดพลาดระหว่างอ่านไฟล์ batch " + (index + 1) + ": " + message, "error");
            setButtonEnabled(true);
          })
          .processFilesBatch(null, fileIds);
      }

      $(function() {
        $("#runBtn").on("click", startRun);
        setStatusText("พร้อมเริ่มทำงาน", "info");
        renderStatusTable();
        renderResultTable();
        refreshIcons();
      });
    </script>
  </body>
</html>
